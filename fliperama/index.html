<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script>
/* o navegador não deve devolver a rolagem antiga ao voltar para a página: cada tela começa do topo */
try{if('scrollRestoration' in history)history.scrollRestoration='manual'}catch(e){}
/* iPhone (atalho da Tela de Início): ao voltar de outra página, o WebKit às vezes informa as margens seguras (Dynamic Island,
   barra de início) como 0 até a próxima rolagem — o topo sobe e as molduras ficam no tamanho errado. Guardamos as maiores
   margens já medidas neste modo (app ou navegador) e o CSS usa --sat/--sab, com env() só como reserva. */
(function(){const r=document.documentElement,K='navemae-safe-'+((window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone?'app':'web');
  let s={};try{s=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
  const ap=()=>{if(s.t)r.style.setProperty('--sat',s.t+'px');if(s.b)r.style.setProperty('--sab',s.b+'px')};ap();
  function measure(){if(innerWidth>innerHeight)return; // só retrato
    const p=document.createElement('div');p.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';
    r.appendChild(p);const cs=getComputedStyle(p),t=parseFloat(cs.paddingTop)||0,b=parseFloat(cs.paddingBottom)||0;p.remove();
    let ch=false;if(t>(s.t||0)){s.t=t;ch=true}if(b>(s.b||0)){s.b=b;ch=true}
    if(ch){try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}ap()}}
  measure();addEventListener('DOMContentLoaded',measure);addEventListener('load',measure);
  addEventListener('pageshow',()=>{measure();setTimeout(measure,300)});addEventListener('resize',()=>setTimeout(measure,200))})();
</script>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140d2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Fliperama · Nave-Mãe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
*{touch-action:manipulation}
:root{--ink:#f3eeff;--dim:#9a8fd0;--pink:#ff3df2;--pink-d:#7a1a76;--cyan:#2ad4ff;--yel:#ffd23f;--amber:#ffb300;--amber-d:#b37a00;--green:#39e35f;--red:#ff3d2e;
  --px:"Press Start 2P",monospace;--vt:"VT323",monospace;--bar:#140d2b;--bar2:#21163f;
  --top:calc(var(--sat,var(--sat,env(safe-area-inset-top))) + 66px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#140d2b}
body{background:#0d0820;color:var(--ink);font-family:var(--vt);font-size:22px;line-height:1.15;height:100vh;height:100dvh;overflow:hidden;
  -webkit-text-size-adjust:100%;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-font-smoothing:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
.spr{display:block;image-rendering:pixelated}
[hidden]{display:none!important}
.crt{position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
/* barra de cima: letreiro de neon */
#top{position:fixed;left:0;right:0;top:0;z-index:30;height:var(--top);background:var(--bar);box-shadow:0 3px 0 0 var(--pink),0 6px 0 0 var(--pink-d),0 8px 18px 0 rgba(255,61,242,.35)}
.top-in{position:absolute;left:0;right:0;bottom:10px;height:42px;max-width:460px;margin:0 auto;display:flex;align-items:center;gap:10px;
  padding:0 calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left))}
.neon{flex:1;text-align:center;font-family:var(--px);font-size:13px;color:#ffd9fb;letter-spacing:.06em;
  text-shadow:0 0 4px var(--pink),0 0 10px var(--pink),0 0 18px rgba(255,61,242,.6);animation:flick 6s steps(1) infinite;white-space:nowrap;overflow:hidden}
@keyframes flick{0%,93%,97%{opacity:1}95%{opacity:.55}}
.tk{display:flex;align-items:center;gap:7px;height:34px;padding:0 10px;font-family:var(--px);font-size:8px;color:var(--ink);background:var(--bar2);
  box-shadow:0 0 0 2px #000,inset 0 0 0 2px #3a2a6a}
.tk:active{transform:translate(2px,2px)}
.clock{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;font-family:var(--px);font-size:9px;color:var(--cyan);text-shadow:0 0 6px rgba(42,212,255,.6);
  background:#06040f;box-shadow:0 0 0 2px #000,inset 0 0 0 2px #1a3a5a}
.clock.low{color:var(--red);text-shadow:0 0 6px rgba(255,61,46,.6);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.4}}
/* ---------- sala ---------- */
#room{position:fixed;left:0;right:0;top:calc(var(--top) + 8px);bottom:0;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;overflow:hidden}
#rc{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
/* caixa de diálogo estilo RPG */
.dlg{position:absolute;left:12px;right:12px;bottom:10px;z-index:3;max-width:440px;margin:0 auto;padding:12px 14px 12px;background:#0b0720;
  box-shadow:0 0 0 2px #000,0 0 0 5px var(--ink),0 0 0 7px #000;animation:dlgIn .18s steps(3)}
@keyframes dlgIn{from{transform:translateY(12px);opacity:0}}
.dlg h4{font-family:var(--px);font-size:10px;font-weight:400;line-height:1.5;color:var(--yel);margin-bottom:6px}
.dlg p{font-size:21px;line-height:1.1;color:var(--ink)}
.dlg .row{display:flex;gap:10px;margin-top:12px}
.dlg .row button{flex:1;padding:12px 6px;font-family:var(--px);font-size:9px;color:#1a0d00;background:var(--yel);box-shadow:inset 0 -4px 0 0 #b38a10,0 0 0 2px #000}
.dlg .row button.alt{color:var(--ink);background:#2a1d55;box-shadow:inset 0 -4px 0 0 #160e33,0 0 0 2px #000}
.dlg .row button:active{transform:translate(2px,2px)}
.dlg .nx{position:absolute;right:12px;bottom:8px;width:10px;height:6px;background:var(--ink);clip-path:polygon(0 0,100% 0,50% 100%);animation:blink .8s steps(1) infinite}
/* controles: direcional + botão A de fliperama */
.ctrl{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;max-width:460px;margin:0 auto;
  padding:14px calc(26px + env(safe-area-inset-right)) calc(14px + var(--sab,var(--sab,env(safe-area-inset-bottom)))) calc(22px + env(safe-area-inset-left))}
.dp{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,50px);gap:4px}
.dp button{display:grid;place-items:center;background:#2a1d55;box-shadow:inset 3px 3px 0 0 #4a3a8a,inset -3px -3px 0 0 #120a2a,0 0 0 3px #000,3px 3px 0 3px #000}
.dp button.dn,.dp button:active{box-shadow:inset 3px 3px 0 0 #120a2a,inset -3px -3px 0 0 #4a3a8a,0 0 0 3px #000;transform:translate(2px,2px)}
.dp .u{grid-column:2;grid-row:1}.dp .l{grid-column:1;grid-row:2}.dp .r{grid-column:3;grid-row:2}.dp .d{grid-column:2;grid-row:3}
.dp .c{grid-column:2;grid-row:2;background:#160e33;box-shadow:inset 2px 2px 0 0 #000}
.abtn{position:relative;width:92px;height:92px;display:grid;place-items:center;font-family:var(--px);font-size:22px;color:#fff;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#ff8a7a 0 14%,#ff3d2e 15% 62%,#a8180c 63%);box-shadow:0 0 0 4px #000,0 6px 0 4px #000,0 0 18px 2px rgba(255,61,46,.35);text-shadow:2px 2px 0 #7a0d05}
.abtn:active,.abtn.dn{transform:translateY(4px);box-shadow:0 0 0 4px #000,0 2px 0 4px #000}
.abtn small{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);font-size:7px;color:var(--dim);white-space:nowrap;text-shadow:none}
.abtn.hint{animation:pulse .9s steps(2) infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px #000,0 6px 0 4px #000,0 0 26px 8px rgba(255,210,63,.75)}}
/* ---------- jogo: o piloto está na frente da máquina ----------
   em cima o letreiro iluminado, no meio o monitor CRT na moldura preta, embaixo o painel com manche e botões,
   e no pé a porta das fichas com o tempo restante. Tudo na cor do gabinete (--cab) e da luz dele (--mq). */
body.play{background:var(--cab-d)}
body.play #top{background:var(--cab);box-shadow:inset 0 -4px 0 0 var(--cab-d),0 3px 0 0 #000}
body.play #top .clock{display:none}
body.play #top .tk{background:var(--cab-d);color:#fff;box-shadow:0 0 0 2px #000,inset 0 0 0 2px rgba(255,255,255,.18)}
body.play .neon{position:relative;flex:1;height:42px;display:grid;place-items:center;font-size:13px;letter-spacing:.04em;animation:none;
  color:#1a0820;text-shadow:1px 1px 0 rgba(255,255,255,.55);background:linear-gradient(180deg,#fff 0,var(--mq) 30%,var(--mq) 70%,var(--mq-d) 100%);
  box-shadow:0 0 0 3px #000,0 0 0 6px var(--cab-d),0 0 22px 4px var(--mq)}
body.play .neon::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:3px;background:rgba(255,255,255,.55)} /* reflexo do acrílico */
#play{position:fixed;left:0;right:0;top:calc(var(--top) + 3px);bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(90deg,var(--cab-d) 0 10px,var(--cab) 10px calc(100% - 10px),var(--cab-d) calc(100% - 10px));
  padding:14px calc(22px + env(safe-area-inset-right)) 0 calc(22px + env(safe-area-inset-left))}
/* monitor: moldura preta com cantos em degrau, tela CRT com vinheta, linhas e reflexo do vidro */
.bezel{flex:1;min-height:0;width:100%;max-width:420px;display:flex;padding:12px;background:#08060c;
  clip-path:polygon(8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px),0 8px,4px 8px,4px 4px,8px 4px)}
.scrw{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#020203;
  box-shadow:inset 0 0 0 2px #1a1622}
.shud{align-self:stretch;margin:0 10px;display:flex;justify-content:space-between;gap:12px;font-family:var(--px);font-size:8px;line-height:1;color:#fff;padding:0 2px 8px}
.shud b{font-weight:400;color:var(--yel)}
.shud .r b{color:var(--cyan)}
.shud .last{color:var(--red);animation:blink 1s steps(1) infinite}
.scr{position:relative;line-height:0}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.scr::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 2px)}
.scr::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 28px 6px rgba(0,0,0,.75);
  background:linear-gradient(135deg,transparent 0 12%,rgba(255,255,255,.06) 12% 15%,transparent 15% 19%,rgba(255,255,255,.04) 19% 21%,transparent 21%)}
.gmsg{position:absolute;inset:0;z-index:1;line-height:1.3;display:grid;place-content:center;justify-items:center;gap:14px;padding:16px;text-align:center;background:rgba(2,2,6,.72)}
.gmsg h3{font-family:var(--px);font-size:13px;line-height:1.5;color:var(--yel);text-shadow:2px 2px 0 #7a3a00}
.gmsg p{font-family:var(--px);font-size:8px;line-height:1.8;color:#e9e2ff}
.gmsg .att{color:#fff;animation:blink 1.1s steps(1) infinite}
.gmsg .big{font-family:var(--px);font-size:24px;color:#5dff83;text-shadow:0 0 8px rgba(57,227,95,.5)}
.gmsg .rec{font-family:var(--px);font-size:8px;color:#1a1200;background:var(--yel);padding:6px 8px}
.gmsg .k{display:inline-block;padding:3px 5px;color:#000;background:var(--mq);margin-right:4px}
.gmsg .k.x{background:#e9e2ff}
/* painel de controle: manche e botões redondos */
.deck{flex:none;position:relative;width:calc(100% + 44px);max-width:470px;display:flex;align-items:center;justify-content:space-between;
  margin-top:16px;padding:18px 34px 16px;background:linear-gradient(180deg,var(--cab-l) 0 6px,var(--cab) 6px);box-shadow:0 -3px 0 0 #000,inset 0 -4px 0 0 var(--cab-d)}
.deck::before{content:"";position:absolute;left:0;right:0;top:6px;height:3px;background:rgba(0,0,0,.25)}
.stick{position:relative;width:150px;height:140px;touch-action:none}
.stick>i{margin-left:9px;margin-top:4px}
.stick .base{position:absolute;left:26px;top:26px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,#2a2630 0 34%,#0c0a10 36% 64%,#3a3442 66% 70%,#0c0a10 72%);
  box-shadow:0 4px 0 0 rgba(0,0,0,.45)}
.stick .shaft{position:absolute;left:60px;top:60px;width:12px;height:12px;border-radius:50%;background:#bfc4cf;box-shadow:0 0 0 2px #000}
.stick .ball{position:absolute;left:42px;top:34px;width:48px;height:48px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#fff 0 9%,var(--mq) 10% 58%,var(--mq-d) 59%);box-shadow:0 0 0 3px #000,0 6px 0 0 rgba(0,0,0,.45);transition:transform .06s steps(2)}
.stick small,.ab small{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);font-family:var(--px);font-size:8px;color:#fff;opacity:.9;white-space:nowrap;text-shadow:2px 2px 0 rgba(0,0,0,.45)}
.btns{display:flex;gap:18px;align-items:flex-start}
.ab{position:relative;display:grid;justify-items:center;width:76px;height:96px}
.ab i{display:block;width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#fff 0 8%,var(--b) 9% 60%,var(--bd) 61%);
  box-shadow:0 0 0 4px #000,0 0 0 8px rgba(0,0,0,.28),0 7px 0 4px #000}
.ab:active i,.ab.dn i{transform:translateY(5px);box-shadow:0 0 0 4px #000,0 0 0 8px rgba(0,0,0,.28),0 2px 0 4px #000}
.ab.start{--b:var(--mq);--bd:var(--mq-d)}
.ab.exit{--b:#e9e2ff;--bd:#8a84a8}
.ab.start.glow i{animation:pulse2 .9s steps(2) infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 4px #000,0 0 0 8px rgba(0,0,0,.28),0 7px 0 4px #000,0 0 22px 6px var(--mq)}}
/* pé da máquina: porta das fichas com o tempo restante */
.coin{flex:none;width:calc(100% + 44px);max-width:470px;display:flex;align-items:center;justify-content:center;gap:16px;
  padding:12px 0 calc(12px + var(--sab,var(--sab,env(safe-area-inset-bottom))));background:var(--cab-d);box-shadow:inset 0 3px 0 0 #000}
.coin .slot{width:22px;height:30px;background:#0b0710;box-shadow:inset 0 0 0 2px #2a2430;display:grid;place-items:center}
.coin .slot::after{content:"";width:4px;height:14px;background:#ff5a3d;box-shadow:0 0 8px #ff5a3d}
.coin .led{font-family:var(--px);font-size:10px;color:#ff5a3d;text-shadow:0 0 6px rgba(255,90,61,.7);background:#0b0710;padding:9px 10px;box-shadow:inset 0 0 0 2px #2a2430}
.coin .led.low{animation:blink 1s steps(1) infinite}
/* tema ÁCIDO (Verme dos dutos): laterais com faixa de risco, gosma escorrendo do letreiro, painel de chapa xadrez */
body.play[data-deco="acido"] #play{background:repeating-linear-gradient(-45deg,#ffd23f 0 6px,#0b0710 6px 12px) left/10px 100% no-repeat,repeating-linear-gradient(-45deg,#ffd23f 0 6px,#0b0710 6px 12px) right/10px 100% no-repeat,var(--cab)}
body.play[data-deco="acido"] .neon::before{content:"";position:absolute;left:0;right:0;bottom:-11px;height:11px;pointer-events:none;--g:linear-gradient(var(--mq),var(--mq));
  background:var(--g) 6% 0/4px 6px no-repeat,var(--g) 14% 0/4px 10px no-repeat,var(--g) 31% 0/4px 4px no-repeat,var(--g) 47% 0/4px 8px no-repeat,var(--g) 63% 0/4px 5px no-repeat,var(--g) 78% 0/4px 11px no-repeat,var(--g) 91% 0/4px 6px no-repeat}
body.play[data-deco="acido"] .deck{background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px),repeating-linear-gradient(-45deg,rgba(0,0,0,.12) 0 2px,transparent 2px 9px),linear-gradient(180deg,var(--cab-l) 0 6px,var(--cab) 6px)}
body.play[data-deco="acido"] .coin .led{color:var(--mq);text-shadow:0 0 6px var(--mq)}
body.play[data-deco="acido"] .coin .slot::after{background:var(--mq);box-shadow:0 0 8px var(--mq)}
body.play[data-deco="acido"] .scrw{box-shadow:inset 0 0 0 2px #1a2a1a,inset 0 0 24px 0 rgba(141,255,58,.12)}
@media (max-height:700px){.stick{transform:scale(.85)}.ab{transform:scale(.85)}.deck{padding:8px 26px 8px;margin-top:10px}}
/* transição: entrar na máquina */
#fade{position:fixed;inset:0;z-index:40;background:#000;pointer-events:none;opacity:0;transition:opacity .22s steps(4)}
#fade.on{opacity:1}
</style>
</head>
<body>
<div class="crt"></div>
<div id="top"><div class="top-in">
  <button class="tk" id="back"><span id="backIco"></span><span id="backT">NAVE</span></button>
  <div class="neon" id="title">FLIPERAMA</div>
  <span class="clock" id="clock"></span>
</div></div>

<section id="room">
  <div class="stage" id="stage"><canvas id="rc"></canvas><div class="dlg" id="dlg" hidden></div></div>
  <div class="ctrl">
    <div class="dp" id="dp">
      <button class="u" data-d="up" aria-label="Cima"></button><button class="l" data-d="left" aria-label="Esquerda"></button>
      <span class="c"></span>
      <button class="r" data-d="right" aria-label="Direita"></button><button class="d" data-d="down" aria-label="Baixo"></button>
    </div>
    <button class="abtn" id="aBtn" aria-label="A">A<small>INTERAGIR</small></button>
  </div>
</section>

<section id="play" hidden>
  <div class="bezel"><div class="scrw" id="scrw">
    <div class="shud"><span id="gU">PONTOS <b id="gScore">0</b></span><span id="gLast" class="last" hidden>ÚLTIMA!</span><span class="r">RECORDE <b id="gBest">0</b></span></div>
    <div class="scr" id="scr"><canvas id="cv"></canvas><div class="gmsg" id="gMsg" hidden></div></div>
  </div></div>
  <div class="deck">
    <div class="stick" id="stick"><i class="base"></i><i class="shaft"></i><i class="ball" id="ball"></i><small>MANCHE</small></div>
    <div class="btns"><button class="ab start" id="bStart" aria-label="Start"><i></i><small>START</small></button></div>
  </div>
  <div class="coin"><span class="slot"></span><span class="led" id="cLed">--:--</span><span class="slot"></span></div>
</section>
<div id="fade"></div>

<script>
/* atualização automática: compara com version.json e recarrega quando sai versão nova */
const APP_V='20261005111716';
(function(){const H0=location.hash;
  async function check(){try{const r=await fetch('../version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const {v}=await r.json();
    if(v&&v!==APP_V&&sessionStorage.getItem('upd')!==v){sessionStorage.setItem('upd',v);location.replace(location.pathname+'?v='+v+H0)}}catch(e){}}
  check();document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});addEventListener('pageshow',e=>{if(e.persisted)check()});
})();
</script>
<script>
/* som no iPhone (opção "Tocar no silencioso" das configurações da Nave-Mãe):
   desligada = modo "ambiente": mistura com a música do celular, e a chave de silencioso cala o app;
   ligada = modo "reprodução": toca mesmo no silencioso, mas o iOS pausa as outras mídias.
   O iOS não oferece a sites um modo que faça as duas coisas. */
function navAudioMode(){let on=false;try{on=!!(JSON.parse(localStorage.getItem('navemae-v1'))||{}).silentPlay}catch(e){}
  try{if(navigator.audioSession)navigator.audioSession.type=on?'playback':'ambient'}catch(e){}}
navAudioMode();addEventListener('pageshow',navAudioMode);
/* vibração leve a cada toque.
   iPhone: o Safari não tem API de vibração; o único jeito é o toque do próprio dedo cair num interruptor nativo
   (<input type=checkbox switch>, iOS 18+). Por isso cada botão recebe por dentro um <label> invisível que cobre
   o botão inteiro e aciona um interruptor escondido; o clique continua chegando ao botão normalmente.
   Android: navigator.vibrate. */
(function(){
  const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

    const l=document.createElement('label');l.setAttribute('data-hap','');l.setAttribute('aria-hidden','true');
    const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');i.tabIndex=-1;
    i.addEventListener('click',e=>e.stopPropagation());l.append(i);
    // o label "rouba" a ação nativa do elemento: refaz a navegação do link e o envio do formulário
    l.addEventListener('click',e=>{if(e.target!==l)return;setTimeout(()=>{if(e.defaultPrevented)return;
      if(el.tagName==='A'&&el.href)location.href=el.href;else if(el.type==='submit'&&el.form)el.form.requestSubmit(el)},0)});
    if(getComputedStyle(el).position==='static')el.style.position='relative';
    el.append(l)}
  function scan(root){if(root.nodeType!==1)return;if(root.matches(SEL))arm(root);root.querySelectorAll(SEL).forEach(arm)}
  const st=document.createElement('style');
  st.textContent='label[data-hap]{position:absolute;inset:0;z-index:5;display:block;margin:0;padding:0;background:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}'+
    'label[data-hap]>input{position:absolute;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}'+
    ':disabled>label[data-hap]{pointer-events:none}';
  document.head.append(st);
  function start(){scan(document.body);new MutationObserver(ms=>{for(const m of ms){m.addedNodes.forEach(scan);
    if(m.type==='childList'&&m.target.closest){const t=m.target.closest(SEL);if(t)arm(t)} // texto do botão trocado: arma de novo
    if(m.type==='attributes'&&m.target.matches&&m.target.matches(SEL))arm(m.target)}}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled']})}
  if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
})();
/* ---------- áudio ---------- */
let AC=null;
/* iOS: ao minimizar o app, o contexto de áudio fica "interrupted"/"suspended" e às vezes não volta sozinho.
   Ao voltar: tenta retomar (e descarta se em 400 ms não voltar). No primeiro toque com o som parado: cria um contexto novo. */
function audioWake(e){const c=AC;if(!c||c.state==='running')return;
  try{navAudioMode()}catch(e){}
  if(e&&(e.type==='touchstart'||e.type==='pointerdown')){if(performance.now()-(audioWake.t||0)<600)return;audioWake.t=performance.now(); // dentro do toque o iOS libera um contexto novo: troca na hora, o som deste toque já sai
    try{c.close()}catch(_){}try{AC=new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(_){AC=null}return}
  try{const p=c.resume&&c.resume();if(p&&p.catch)p.catch(()=>{})}catch(e){}
  setTimeout(()=>{if(AC===c&&c.state!=='running'){try{c.close()}catch(e){}AC=null}},400)}

['touchstart','pointerdown'].forEach(t=>document.addEventListener(t,audioWake,{passive:true,capture:true}));

<script>
const $=s=>document.querySelector(s);
const PAL={"J":"#2a2e38","K":"#454b58","Q":"#737a88","U":"#b4bac6","0":"#ada38a","1":"#f2eee2","2":"#cfc8b2","3":"#9a927a","4":"#4f4a3c","5":"#24323c","6":"#0e161c","7":"#d9a06a","8":"#a8703a","9":"#e0d8c2","=":"#6e6652","A":"#ffe066","C":"#c8faff","D":"#5f5ca8","E":"#34316e","F":"#a8e8ff","G":"#b6ffcf","L":"#d8d6ff","M":"#9b98d4","O":"#ffb300","R":"#ff7a66","S":"#f6dcb6","W":"#ffffff","X":"#3ff2c4","Y":"#fff3a0","a":"#2b2f38","b":"#ffb300","c":"#40d8ff","g":"#39e35f","h":"#1f9a3a","k":"#0b0a1a","n":"#123a66","o":"#d97a00","q":"#8a1a10","r":"#e03a26","s":"#d9a066","t":"#a8703a","u":"#8a4a00","v":"#6b4520","x":"#1f9a7e"};
const GRID=2,HDC=new Map(),BY4=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function upx(g,n){const h=g.length,w=g[0].length,at=(x,y)=>x<0||y<0||x>=w||y>=h?'.':g[y][x];
  if(n===2){const o=Array.from({length:h*2},()=>Array(w*2));
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const P=g[y][x],A=at(x,y-1),B=at(x+1,y),C=at(x-1,y),D=at(x,y+1);
      o[2*y][2*x]=C===A&&C!==D&&A!==B?A:P;o[2*y][2*x+1]=A===B&&A!==C&&B!==D?B:P;
      o[2*y+1][2*x]=D===C&&D!==B&&C!==A?C:P;o[2*y+1][2*x+1]=B===D&&B!==A&&D!==C?D:P}return o}
  if(n===3){const o=Array.from({length:h*3},()=>Array(w*3));
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const E=g[y][x],A=at(x-1,y-1),B=at(x,y-1),C=at(x+1,y-1),D=at(x-1,y),F=at(x+1,y),G=at(x-1,y+1),H=at(x,y+1),I=at(x+1,y+1);
      const r=[D===B&&B!==F&&D!==H?D:E,(D===B&&B!==F&&D!==H&&E!==C)||(B===F&&B!==D&&F!==H&&E!==A)?B:E,B===F&&B!==D&&F!==H?F:E,
        (D===B&&B!==F&&D!==H&&E!==G)||(D===H&&D!==B&&H!==F&&E!==A)?D:E,E,(B===F&&B!==D&&F!==H&&E!==I)||(H===F&&D!==H&&B!==F&&E!==C)?F:E,
        D===H&&D!==B&&H!==F?D:E,(D===H&&D!==B&&H!==F&&E!==I)||(H===F&&D!==H&&B!==F&&E!==G)?H:E,H===F&&D!==H&&B!==F?F:E];
      for(let k=0;k<9;k++)o[3*y+(k/3|0)][3*x+k%3]=r[k]}return o}
  if(n===4)return upx(upx(g,2),2);
  if(n===6)return upx(upx(g,2),3);
  return g}
const hx=c=>{c=c.replace('#','');if(c.length===3)c=[...c].map(v=>v+v).join('');return[0,2,4].map(i=>parseInt(c.slice(i,i+2),16))};
const mixc=(a,b,t)=>{const p=hx(a),q=hx(b);return '#'+p.map((v,i)=>Math.round(v+(q[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const lum=c=>{const[r,g,b]=hx(c);return(.2126*r+.7152*g+.0722*b)/255};
function hdRows(rows,s,ov){const key=s+'|'+rows.join('/')+'|'+(ov?JSON.stringify(ov):'');if(HDC.has(key))return HDC.get(key);
  const n=Math.max(1,Math.round(s/GRID));let g=upx(rows.map(r=>[...r]),n);
  const h=g.length,w=g[0].length,col=g.map(r=>r.map(c=>c==='.'?null:((ov&&ov[c])||PAL[c])));

  const res=col.map(r=>r.slice()),k=n>=2?1:.6;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const c=col[y][x];if(c===null)continue;
    if(out(c)){ // contorno: do lado iluminado vira um tom escuro da cor vizinha
      const nb=[[x+1,y],[x,y+1]].map(([a,b])=>!O(a,b)?col[b][a]:null).find(Boolean);
      res[y][x]=nb?mixc(nb,'#05040c',.62):'#08070f';continue}
    let d=c;
    if(n>=2){ // volume: faixas de luz de cima para baixo, com pontilhado nas bordas das faixas
      const v=y/h+(BY4[y%4][x%4]/16-.5)*.16;if(v<.3)d=mixc(c,'#fff4d6',.10);else if(v>.7)d=mixc(c,'#16113a',.14)}

/* ---------- sintetizador 16-bit (mesmo código nos três apps) ----------
   note: onda com envelope, deslize de tom (to) e vibrato (vib); noise: ruído filtrado para
   sopros, batidas e desmoronamentos; arp: sequência de notas. */
function mkSYN(ctx,on){let nb=null;
  const buf=c=>{if(!nb){nb=c.createBuffer(1,c.sampleRate*.6|0,c.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return nb};

    os.type=o.type||'square';os.frequency.setValueAtTime(f,n);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,n+d);

    g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.005);g.gain.setValueAtTime(v,n+d*.55);g.gain.linearRampToValueAtTime(0,n+d);
    os.connect(g).connect(c.destination);os.start(n);os.stop(n+d+.03)}catch(e){}}

    g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+(o.att||.008));g.gain.linearRampToValueAtTime(0,n+d);
    s.connect(fl).connect(g).connect(c.destination);s.start(n);s.stop(n+d+.03)}catch(e){}}

  return{note,noise,arp}}

/* =================== FLIPERAMA ===================

   Jogos novos: arquivo em jogos/ que chama ARC.add({...}), id na lista JOGOS; a próxima máquina livre da sala passa a rodar o jogo. */
const JOGOS=['verme'];

/* ---------- desenho em pixels ---------- */
function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}

/* letras do letreiro */

/* piso, paredes, tapetes e letreiro: desenhados uma vez */

(function(){const x=BG.getContext('2d');let s=11;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;

  R(0,x,0,0,MW*T,3,'#0b0720');R(0,x,0,WALL*T-4,MW*T,4,'#0b0720');R(0,x,0,WALL*T-5,MW*T,1,'#3a2a6a');
  R(0,x,0,6,MW*T,1,'#7a1a76');R(0,x,0,7,MW*T,1,'#ff3df2');R(0,x,0,8,MW*T,1,'#7a1a76');
  const sw=textW('FLIPERAMA',2),sx=(MW*T-sw)>>1;text3(x,'FLIPERAMA',sx-1,15,2,'#5a1a6a');text3(x,'FLIPERAMA',sx+1,15,2,'#5a1a6a');text3(x,'FLIPERAMA',sx,14,2,'#ffd9fb');
  [[0.4,'#2ad4ff'],[11.1,'#ffd23f']].forEach(([tx,c])=>{const X=tx*T|0;R(0,x,X,12,10,14,'#0b0720');R(0,x,X+1,13,8,12,c);R(0,x,X+2,15,6,2,'#0b0720');R(0,x,X+3,19,4,4,'#0b0720')});

(function(){let sx=0,sy=0,act=false;const el=$('#scr');
  el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;act=true},{passive:true});
  el.addEventListener('touchmove',e=>{if(!act)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;
    e.preventDefault();input(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));sx=t.clientX;sy=t.clientY},{passive:false});
  el.addEventListener('touchend',()=>{act=false},{passive:true});
  addEventListener('keydown',e=>{if($('#play').hidden)return;const d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];
    if(d){e.preventDefault();input(d)}else if(e.key==='Enter'||e.key===' '){e.preventDefault();pressStart()}else if(e.key==='Escape'){pressExit()}})})();

/* ícones das setas e voltar */
const ARW=["...kk...","..kLLk..",".kLLLLk.","kLLLLLLk","kkkLLkkk","..kLLk..","..kLLk..","..kkkk.."];
const rotG=g=>g[0].split('').map((_,x)=>g.map(r=>r[x]).reverse().join(''));
['up','right','down','left'].forEach((d,n)=>{let g=ARW;for(let k=0;k<n;k++)g=rotG(g);const s=spriteRows(g,2,{L:'#e9e2ff'});
  document.querySelectorAll(`[data-d="${d}"]`).forEach(b=>b.innerHTML=s)});
$('#backIco').innerHTML=spriteRows(["...k","..kL",".kLL","kLLL",".kLL","..kL","...k"],2,{L:'#e9e2ff'});
$('#back').onclick=()=>{if(!$('#play').hidden){pressExit();return}talk('exit')};

/* carrega os jogos e abre a sala */
Promise.all(['conversas',...JOGOS.map(id=>'jogos/'+id)].map(f=>new Promise(res=>{const s=document.createElement('script');s.src=`${f}.js?v=${APP_V}`;s.onload=s.onerror=res;document.head.append(s)}))).then(()=>{
  fit();clock();raf=requestAnimationFrame(loop);
  setTimeout(()=>{fit();if(!unlocked())talk('locked');else if(left()<=0)talk('out');else if(A.intro!==dk()){A.intro=dk();saveA();talk('intro')}},350)});
addEventListener('resize',()=>{if(!$('#room').hidden)fit()});
</script>
</body>
