<script>
/* iPhone (atalho da Tela de Início): ao voltar de outra página, o WebKit às vezes informa as margens seguras (Dynamic Island,
   barra de início) como 0 até a próxima rolagem — o topo sobe e as molduras ficam no tamanho errado. Guardamos as maiores
   margens já medidas neste modo (app ou navegador) e o CSS usa --sat/--sab, com env() só como reserva. */
(function(){const r=document.documentElement,K='navemae-safe-'+((window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone?'app':'web');
  let s={};try{s=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
  const ap=()=>{if(s.t)r.style.setProperty('--sat',s.t+'px');if(s.b)r.style.setProperty('--sab',s.b+'px')};ap();
  function measure(){if(innerWidth>innerHeight)return; // só retrato
    const p=document.createElement('div');p.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';
    r.appendChild(p);const cs=getComputedStyle(p),t=parseFloat(cs.paddingTop)||0,b=parseFloat(cs.paddingBottom)||0;p.remove();
    let ch=false;if(t>(s.t||0)){s.t=t;ch=true}if(b>(s.b||0)){s.b=b;ch=true}
    if(ch){try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}ap()}}
  measure();addEventListener('DOMContentLoaded',measure);addEventListener('load',measure);
  addEventListener('pageshow',()=>{measure();setTimeout(measure,300)});addEventListener('resize',()=>setTimeout(measure,200))})();
</script>

<style>
*{touch-action:manipulation}
:root{--ink:#f3eeff;--dim:#9a8fd0;--pink:#ff3df2;--pink-d:#7a1a76;--cyan:#2ad4ff;--yel:#ffd23f;--amber:#ffb300;--amber-d:#b37a00;--green:#39e35f;--red:#ff3d2e;

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

body{background:#0d0820;color:var(--ink);font-family:var(--vt);font-size:22px;line-height:1.15;height:100vh;height:100dvh;overflow:hidden;

  box-shadow:inset 0 -4px 0 0 #b38a10,0 0 0 3px #000}
.gbtn:active{transform:translate(2px,2px)}
.gbtn.alt{background:#2a1d55;color:var(--ink);box-shadow:inset 0 -4px 0 0 #160e33,0 0 0 3px #000}
.pad{flex:none;display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,48px);gap:5px;margin-top:16px}
.pad button{display:grid;place-items:center;background:#2a1d55;box-shadow:inset 3px 3px 0 0 #4a3a8a,inset -3px -3px 0 0 #120a2a,0 0 0 3px #000,3px 3px 0 3px #000}
.pad button.dn,.pad button:active{box-shadow:inset 3px 3px 0 0 #120a2a,inset -3px -3px 0 0 #4a3a8a,0 0 0 3px #000;transform:translate(2px,2px)}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .r{grid-column:3;grid-row:2}.pad .d{grid-column:2;grid-row:3}

@media (max-height:700px){.pad{grid-template-rows:repeat(3,40px);margin-top:10px}.dp{grid-template-rows:repeat(3,42px)}.abtn{width:78px;height:78px}}
/* transição: entrar na máquina */
#fade{position:fixed;inset:0;z-index:40;background:#000;pointer-events:none;opacity:0;transition:opacity .22s steps(4)}
#fade.on{opacity:1}
</style>

<script>
/* atualização automática: compara com version.json e recarrega quando sai versão nova */
const APP_V='20261005105158';
(function(){const H0=location.hash;
  async function check(){try{const r=await fetch('../version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const {v}=await r.json();
    if(v&&v!==APP_V&&sessionStorage.getItem('upd')!==v){sessionStorage.setItem('upd',v);location.replace(location.pathname+'?v='+v+H0)}}catch(e){}}
  check();document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});addEventListener('pageshow',e=>{if(e.persisted)check()});
})();

<script>
/* som no iPhone (opção "Tocar no silencioso" das configurações da Nave-Mãe):
   desligada = modo "ambiente": mistura com a música do celular, e a chave de silencioso cala o app;
   ligada = modo "reprodução": toca mesmo no silencioso, mas o iOS pausa as outras mídias.
   O iOS não oferece a sites um modo que faça as duas coisas. */
function navAudioMode(){let on=false;try{on=!!(JSON.parse(localStorage.getItem('navemae-v1'))||{}).silentPlay}catch(e){}
  try{if(navigator.audioSession)navigator.audioSession.type=on?'playback':'ambient'}catch(e){}}
navAudioMode();addEventListener('pageshow',navAudioMode);
/* vibração leve a cada toque.
   iPhone: o Safari não tem API de vibração; o único jeito é o toque do próprio dedo cair num interruptor nativo
   (<input type=checkbox switch>, iOS 18+). Por isso cada botão recebe por dentro um <label> invisível que cobre
   o botão inteiro e aciona um interruptor escondido; o clique continua chegando ao botão normalmente.
   Android: navigator.vibrate. */
(function(){
  const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const SEL='button,a[href],[role=button]';
  if(!IOS){document.addEventListener('click',e=>{if(navigator.vibrate&&e.target.closest(SEL))try{navigator.vibrate(8)}catch(_){}} ,true);return}
  function arm(el){if(el.disabled||el.querySelector(':scope>label[data-hap]'))return;
    const l=document.createElement('label');l.setAttribute('data-hap','');l.setAttribute('aria-hidden','true');
    const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');i.tabIndex=-1;
    i.addEventListener('click',e=>e.stopPropagation());l.append(i);
    // o label "rouba" a ação nativa do elemento: refaz a navegação do link e o envio do formulário
    l.addEventListener('click',e=>{if(e.target!==l)return;setTimeout(()=>{if(e.defaultPrevented)return;
      if(el.tagName==='A'&&el.href)location.href=el.href;else if(el.type==='submit'&&el.form)el.form.requestSubmit(el)},0)});
    if(getComputedStyle(el).position==='static')el.style.position='relative';
    el.append(l)}
  function scan(root){if(root.nodeType!==1)return;if(root.matches(SEL))arm(root);root.querySelectorAll(SEL).forEach(arm)}
  const st=document.createElement('style');
  st.textContent='label[data-hap]{position:absolute;inset:0;z-index:5;display:block;margin:0;padding:0;background:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}'+
    'label[data-hap]>input{position:absolute;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}'+
    ':disabled>label[data-hap]{pointer-events:none}';
  document.head.append(st);
  function start(){scan(document.body);new MutationObserver(ms=>{for(const m of ms){m.addedNodes.forEach(scan);
    if(m.type==='childList'&&m.target.closest){const t=m.target.closest(SEL);if(t)arm(t)} // texto do botão trocado: arma de novo
    if(m.type==='attributes'&&m.target.matches&&m.target.matches(SEL))arm(m.target)}}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled']})}
  if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
})();
/* ---------- áudio ---------- */
let AC=null;
/* iOS: ao minimizar o app, o contexto de áudio fica "interrupted"/"suspended" e às vezes não volta sozinho.
   Ao voltar: tenta retomar (e descarta se em 400 ms não voltar). No primeiro toque com o som parado: cria um contexto novo. */
function audioWake(e){const c=AC;if(!c||c.state==='running')return;
  try{navAudioMode()}catch(e){}
  if(e&&(e.type==='touchstart'||e.type==='pointerdown')){if(performance.now()-(audioWake.t||0)<600)return;audioWake.t=performance.now(); // dentro do toque o iOS libera um contexto novo: troca na hora, o som deste toque já sai
    try{c.close()}catch(_){}try{AC=new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(_){AC=null}return}
  try{const p=c.resume&&c.resume();if(p&&p.catch)p.catch(()=>{})}catch(e){}
  setTimeout(()=>{if(AC===c&&c.state!=='running'){try{c.close()}catch(e){}AC=null}},400)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)audioWake()});
addEventListener('pageshow',audioWake);addEventListener('focus',audioWake);
['touchstart','pointerdown'].forEach(t=>document.addEventListener(t,audioWake,{passive:true,capture:true}));

</script>

const GRID=2,HDC=new Map(),BY4=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function upx(g,n){const h=g.length,w=g[0].length,at=(x,y)=>x<0||y<0||x>=w||y>=h?'.':g[y][x];
  if(n===2){const o=Array.from({length:h*2},()=>Array(w*2));

      o[2*y][2*x]=C===A&&C!==D&&A!==B?A:P;o[2*y][2*x+1]=A===B&&A!==C&&B!==D?B:P;

    if(back){r(3,7,6,5,'Q');r(3,7,6,1,'U')}else{r(2,8,1,3,'Q');r(9,8,1,3,'Q')}
    r(3,8,6,5,'9');r(8,8,1,5,'0');
    if(!back){r(4,8,4,2,'2');r(7,8,1,2,'3');r(4,10,4,1,'3')}else{r(3,8,6,4,'Q');r(3,8,6,1,'U');r(4,9,1,1,'c');r(7,9,1,1,'c')}
    r(3,12,6,1,'K');if(!back)r(5,12,2,1,'O');
    r(2,8,2,2,'2');r(8,8,2,2,'3');                          // ombreiras
    r(2,10,1,3+(f===2?1:0),'9');r(9,10,1,3+(f===1?1:0),'0'); // braços balançando
    r(2,13+(f===2?1:0),1,1,'K');r(9,13+(f===1?1:0),1,1,'K');
    r(4,13,4,1,'9');
    r(4,14,2,5-lu,'9');r(6,14,2,5-ru,'0');r(4,16,2,1,'2');r(6,16,2,1,'3');
    r(4,19-lu,2,2,'K');r(6,19-ru,2,2,'K');r(3,20-lu,1,1,'K');r(8,20-ru,1,1,'K');
    // capacete
    r(4,0,4,1,'1');r(3,1,6,5,'2');r(3,1,2,2,'1');r(8,1,1,5,'3');r(4,6,4,1,'3');
    if(!back){r(4,2,4,3,'5');r(4,4,4,1,'6');g[2][4]='C';g[5][5]='7';g[5][6]='8'}else{r(4,3,4,2,'3')}
    r(5,7,2,1,'K');
  }else{ // de lado, olhando para a direita
    r(2,7,2,6,'Q');r(2,7,2,1,'U');g[9][2]='c';
    r(4,7,4,6,'9');r(7,7,1,6,'0');r(4,12,4,1,'K');r(4,7,3,2,'2');
    const sw=f===1?1:f===2?-1:0;                             // passada
    r(4+sw,13,2,6,'9');r(6-sw,13,2,6,'0');r(4+sw,15,2,1,'2');r(6-sw,15,2,1,'3');
    r(4+sw,19,3,2,'K');r(6-sw,19,3,2,'K');
    r(5+sw,8,2,4,'0');r(5+sw,12,2,1,'K');                    // braço
    r(4,0,4,1,'1');r(3,1,6,5,'2');r(3,1,2,2,'1');r(8,1,1,5,'3');r(4,6,4,1,'3');
    r(6,2,3,3,'5');r(6,4,3,1,'6');g[2][6]='C';g[5][7]='7';
    r(5,7,2,1,'K');
  }
  // contorno
  const o=g.map(r=>r.slice());for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(g[y][x]==='.'&&[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>g[y+b]&&g[y+b][x+a]&&g[y+b][x+a]!=='.'))o[y][x]='k';
  let rows=o.map(r=>r.join(''));if(dir==='left')rows=rows.map(r=>[...r].reverse().join(''));
  return grid(rows,PC)}
const PF={};['down','up','left','right'].forEach(d=>PF[d]=[0,1,2].map(f=>pilotFrame(d,f)));

/* ---------- estado da sala ---------- */
const P={x:5,y:MH-2,px:5*T,py:(MH-2)*T,dir:'up',mv:null,t0:0,path:[],step:0};
if(A.pos&&!solid(A.pos[0],A.pos[1])){P.x=A.pos[0];P.y=A.pos[1];P.px=P.x*T;P.py=P.y*T;P.dir=A.pos[2]||'up'}
let held=null,dlgOpen=null,cam={x:0,y:0},VW=MW*T,VH=MH*T,roomOn=true,raf=0;
const DV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const STEP=170;
function fit(){const st=$('#stage'),w=Math.floor(st.clientWidth/2),h=Math.floor(st.clientHeight/2);VW=Math.min(MW*T,w);VH=Math.min(MH*T,h);
  const c=$('#rc');c.width=VW;c.height=VH;c.style.width=VW*2+'px';c.style.height=VH*2+'px'}
function tryMove(d){if(P.mv||dlgOpen)return false;P.dir=d;const[dx,dy]=DV[d],nx=P.x+dx,ny=P.y+dy;
  if(solid(nx,ny)){if(!tryMove.b||performance.now()-tryMove.b>300){SND.bump();tryMove.b=performance.now()}return false}
  P.mv={fx:P.x,fy:P.y,tx:nx,ty:ny};P.t0=performance.now();P.step++;if(P.step%2)SND.step();return true}
function arrive(){P.x=P.mv.tx;P.y=P.mv.ty;P.mv=null;A.pos=[P.x,P.y,P.dir];saveA();
  if(MAP[P.y][P.x]==='X'&&!arrive.mat){arrive.mat=true;talk('exit');return}
  if(MAP[P.y][P.x]!=='X')arrive.mat=false;
  if(P.path.length){const n=P.path.shift();tryMove(n)}else if(P.goal){const g=P.goal;P.goal=null;P.dir=g.face;interact()}}
arrive.mat=MAP[P.y][P.x]==='X';
function facing(){const[dx,dy]=DV[P.dir];return objAt(P.x+dx,P.y+dy)}
/* andar até onde tocou (caminho mais curto pelas casas livres) */
function walkTo(tx,ty,goal){const key=(x,y)=>y*MW+x,prev=new Map([[key(P.x,P.y),null]]),q=[[P.x,P.y]];
  while(q.length){const[x,y]=q.shift();if(x===tx&&y===ty)break;for(const d of['up','down','left','right']){const[dx,dy]=DV[d],nx=x+dx,ny=y+dy,k=key(nx,ny);
    if(solid(nx,ny)||prev.has(k))continue;prev.set(k,[x,y,d]);q.push([nx,ny])}}
  if(!prev.has(key(tx,ty)))return;const path=[];let k=key(tx,ty);while(prev.get(k)){const[x,y,d]=prev.get(k);path.unshift(d);k=key(x,y)}
  P.path=path;P.goal=goal||null;if(!path.length){if(goal){P.dir=goal.face;P.goal=null;interact()}return}tryMove(P.path.shift())}

/* ---------- diálogos ---------- */
function gameOf(o){return o&&o.k==='cab'&&o.i!=null?ARC.list[o.i]:null}
function dlg(h,btns){const d=$('#dlg');dlgOpen=btns||[];d.innerHTML=h+(btns&&btns.length?`<div class="row">${btns.map((b,i)=>`<button class="${b.alt?'alt':''}" data-i="${i}">${b.t}</button>`).join('')}</div>`:'<i class="nx"></i>');
  d.hidden=false;SND.talk();d.querySelectorAll('[data-i]').forEach(b=>b.onclick=e=>{e.stopPropagation();const f=dlgOpen[+b.dataset.i];closeDlg();f.f&&f.f()});
  $('#aBtn').classList.remove('hint')}
function closeDlg(){$('#dlg').hidden=true;dlgOpen=null}
function talk(kind,o){
  if(kind==='exit'){dlg('<h4>SAÍDA</h4><p>Voltar para a nave?</p>',[{t:'VOLTAR',f:()=>{SND.door();$('#fade').classList.add('on');setTimeout(home,260)}},{t:'FICAR',alt:true}]);return}
  if(kind==='intro'){dlg(`<h4>RECOMPENSA DO DIA!</h4><p>Missões completas: você ganhou ${MIN} min de fliperama. Ande até uma máquina acesa e aperte A.</p>`);return}
  if(kind==='locked'){dlg(MIN===0?'<h4>FLIPERAMA FECHADO</h4><p>Desligado na Área dos pais.</p>':'<h4>FLIPERAMA FECHADO</h4><p>As máquinas ligam quando as missões de hoje estiverem completas.</p>');return}
  if(kind==='out'){dlg(`<h4>FICHAS DE HOJE ACABARAM</h4><p>Amanhã tem mais ${MIN} min. Complete as missões para liberar.</p>`);return}}
function interact(){if(dlgOpen){const b=dlgOpen;if(b.length){const f=b[0];closeDlg();f.f&&f.f()}else closeDlg();return}
  if(MAP[P.y][P.x]==='X'){talk('exit');return}
  const o=facing();if(!o)return;
  if(o.k==='cab'){const g=gameOf(o);
    if(!g){dlg('<h4>EM BREVE</h4><p>Esta máquina ainda está sendo montada. Logo chega um jogo novo aqui!</p>');return}
    if(!unlocked()){talk('locked');return}if(left()<=0){talk('out');return}
    dlg(`<h4>${g.name}</h4><p>${g.desc}<br><span style="color:var(--yel)">Recorde: ${A.best[g.id]||0} ${g.unit.toLowerCase()}</span></p>`,[{t:'JOGAR',f:()=>enter(g,o)},{t:'AGORA NÃO',alt:true}]);return}
  if(o.k==='claw'){dlg('<h4>MÁQUINA DE GARRA</h4><p>Uma placa diz: EM MANUTENÇÃO. Os bichinhos lá dentro parecem esperar alguém.</p>');return}
  if(o.k==='soda'){dlg('<h4>REFRIGERANTE</h4><p>Suco de Cometa, Água de Saturno e Gás Nebulosa. Sem fichas para isso hoje.</p>');return}
  if(o.k==='bench'){dlg('<h4>BANCO</h4><p>Um bom lugar para descansar entre uma partida e outra.</p>');return}
  if(o.k==='plant'){dlg('<h4>PLANTA</h4><p>Uma samambaia espacial. Alguém rega ela todo dia.</p>');return}}

/* ---------- desenho da sala ---------- */
function drawRoom(t){const c=$('#rc'),x=c.getContext('2d');x.imageSmoothingEnabled=false;
  // movimento
  if(P.mv){const k=Math.min(1,(t-P.t0)/STEP);P.px=(P.mv.fx+(P.mv.tx-P.mv.fx)*k)*T;P.py=(P.mv.fy+(P.mv.ty-P.mv.fy)*k)*T;if(k>=1)arrive()}
  if(!P.mv&&held&&!dlgOpen){P.path=[];P.goal=null;tryMove(held)}
  // câmera segue o piloto
  cam.x=Math.max(0,Math.min(MW*T-VW,Math.round(P.px+T/2-VW/2)));cam.y=Math.max(0,Math.min(MH*T-VH,Math.round(P.py-VH/2)));
  x.drawImage(BG,-cam.x,-cam.y);
  // brilho do neon pulsando
  if(Math.floor(t/1700)%5===0){x.fillStyle='rgba(255,61,242,.12)';x.fillRect(-cam.x,6-cam.y,MW*T,3)}
  const items=OBJ.map(o=>({y:o.y*T+T,o}));
  items.push({y:P.py+T+.5,p:true});items.sort((a,b)=>a.y-b.y);
  const near=facing(),blink=Math.floor(t/400)%2;
  for(const it of items){
    if(it.p){const fr=P.mv?1+(Math.floor((t-P.t0)/(STEP/2))+P.step)%2:0,img=PF[P.dir][P.mv?(fr===1?1:2):0];x.drawImage(img,Math.round(P.px+2-cam.x),Math.round(P.py+T-22-cam.y));continue}
    const o=it.o,X=o.x*T-cam.x,Y=o.y*T+T-cam.y;
    if(o.k==='cab'){const g=gameOf(o),col=CABCOL[o.i%CABCOL.length];o.img=o.img||cabSprite(col[0],g?col[1]:'#3a2a5a');x.drawImage(o.img,X,Y-30);
      const sx=X+4,sy=Y-30+8;
      if(g&&unlocked()&&left()>0){ // tela ligada: modo de demonstração
        if(g.attract)g.attract(x,sx,sy,8,7,t);else{x.fillStyle='#1a3a2a';x.fillRect(sx,sy,8,7)}}
      else if(g){x.fillStyle='#0b1a10';x.fillRect(sx,sy,8,7)}
      else{x.fillStyle=blink?'#141024':'#1a1430';x.fillRect(sx,sy,8,7);x.fillStyle='#3a2a5a';x.fillRect(sx+3,sy+1,2,3);x.fillRect(sx+3,sy+5,2,1)} // "?" apagado
      if(g&&!(unlocked()&&left()>0)){}
    }else{const img=SP[o.k];x.drawImage(img,X,Y-img.height)}
    if(near===o&&!dlgOpen&&!P.mv){ // balão com "A" acima do que está na frente
      const bx=X+(o.w||1)*T/2-5,by=Y-(o.k==='cab'||o.k==='claw'||o.k==='soda'?44:o.k==='plant'?38:26)+(blink?0:-1);
      x.fillStyle='#07060f';x.fillRect(bx-1,by-1,12,11);x.fillStyle='#f3eeff';x.fillRect(bx,by,10,9);x.fillRect(bx+4,by+9,2,2);
      x.fillStyle='#ff3d2e';[[4,1,2,1],[3,2,1,2],[6,2,1,2],[3,4,4,1],[3,5,1,3],[6,5,1,3]].forEach(([a,b,w,h])=>x.fillRect(bx+a,by+b,w,h))}}
  $('#aBtn').classList.toggle('hint',!!near&&!dlgOpen&&!P.mv||MAP[P.y][P.x]==='X'&&!dlgOpen)}
function loop(t){raf=requestAnimationFrame(loop);if(roomOn)drawRoom(t)}

/* ---------- controles da sala ---------- */
document.querySelectorAll('#dp [data-d]').forEach(b=>{const d=b.dataset.d;
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(dlgOpen&&!dlgOpen.length){closeDlg()}held=d;b.classList.add('dn');try{b.setPointerCapture(e.pointerId)}catch(_){}});
  const up=()=>{if(held===d)held=null;b.classList.remove('dn')};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)});
$('#aBtn').addEventListener('pointerdown',e=>{e.preventDefault();$('#aBtn').classList.add('dn');setTimeout(()=>$('#aBtn').classList.remove('dn'),120);interact()});
$('#rc').addEventListener('pointerdown',e=>{if(dlgOpen){if(!dlgOpen.length)closeDlg();return}
  const r=$('#rc').getBoundingClientRect(),ax=(e.clientX-r.left)/2+cam.x,ay=(e.clientY-r.top)/2+cam.y;let tx=Math.floor(ax/T),ty=Math.floor(ay/T);
  // tocou numa máquina (inclusive na parte de cima do desenho): vai até a frente dela
  let o=objAt(tx,ty)||objAt(tx,ty+1);
  if(o&&!(o.k==='plant'&&!objAt(tx,ty))){const fx=o.x+((o.w||1)>1?Math.min(1,Math.max(0,tx-o.x)):0),fy=o.y+1;if(!solid(fx,fy)){walkTo(fx,fy,{face:'up'});return}}
  if(!solid(tx,ty))walkTo(tx,ty)});
$('#dlg').addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;if(dlgOpen&&!dlgOpen.length)closeDlg()});
addEventListener('keydown',e=>{if(!$('#room').hidden){const d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];
  if(d){e.preventDefault();held=d}else if(e.key==='a'||e.key==='Enter'||e.key===' '){e.preventDefault();interact()}}});
addEventListener('keyup',e=>{if({ArrowUp:1,ArrowDown:1,ArrowLeft:1,ArrowRight:1}[e.key])held=null});

/* =================== PARTIDA (na tela da máquina) =================== */
let G=null,cur=null,curObj=null,run=false,paused=false,last=false,score=0,timer=null;
function size(){const w=$('#scrw').clientWidth-24,h=$('#scrw').clientHeight-24,c=cur.cell||8,px=2*c;
  return{cols:Math.max(10,Math.floor(w/px)),rows:Math.max(10,Math.floor(h/px)),c}}
function enter(g,o){cur=g;curObj=o;SND.coin();$('#fade').classList.add('on');
  setTimeout(()=>{roomOn=false;held=null;$('#room').hidden=true;$('#play').hidden=false;$('#title').textContent=g.name;$('#backT').textContent='SALA';
    const col=CABCOL[o.i%CABCOL.length];$('#cabw').style.setProperty('--cab',col[0]);$('#cabw').style.setProperty('--mq',col[1]);$('#marq').textContent=g.name;
    $('#gU').innerHTML=`${g.unit} <b id="gScore">0</b>`;$('#gBest').textContent=A.best[g.id]||0;
    requestAnimationFrame(()=>{const{cols,rows,c}=size(),cv=$('#cv');cv.width=cols*c;cv.height=rows*c;cv.style.width=cols*c*2+'px';cv.style.height=rows*c*2+'px';
      const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
      G=g.make({cv,ctx,cols,rows,cell:c,sfx:SY,score:n=>{score=n;$('#gScore').textContent=n},over:()=>gameOver()});
      G.ready();ready();$('#fade').classList.remove('on')})},240)}
function ready(){run=false;score=0;$('#gScore').textContent=0;padLed(false);clock();
  msg(`<h3>${cur.name}</h3><p>${cur.desc}</p><p style="color:var(--yel)">Deslize na tela ou use as setas para começar.</p>`)}
function msg(h){const m=$('#gMsg');if(h==null){m.hidden=true;return}m.innerHTML=h;m.hidden=false}
function begin(){if(run||left()<=0)return;run=true;paused=false;last=false;msg(null);SND.start();padLed(true);A.plays[cur.id]=(A.plays[cur.id]||0)+1;saveA();G.start();
  clearInterval(timer);timer=setInterval(tick,1000)}
function tick(){if(!run||paused)return;if(A.used<MIN*60){A.used++;saveA()}const l=left();clock();
  if(l===60)SND.warn();if(l===0&&!last){last=true;$('#gLast').hidden=false;SND.warn()}}
function gameOver(){run=false;clearInterval(timer);padLed(false);const b=A.best[cur.id]||0,rec=score>b;
  if(rec){A.best[cur.id]=score;$('#gBest').textContent=score;saveA();setTimeout(SND.rec,300)}else SND.over();
  const more=left()>0;$('#gLast').hidden=true;last=false;
  msg(`<h3>${more?'FIM DE JOGO':'FICHAS ACABARAM'}</h3><span class="big">${score}</span><p>${cur.unit.toLowerCase()}</p>${rec&&score?'<span class="rec">NOVO RECORDE!</span>':''}
    ${more?'<button class="gbtn" id="gAgain">DE NOVO</button>':'<p>Amanhã tem mais.</p>'}<button class="gbtn alt" id="gExit">VOLTAR À SALA</button>`);
  const a=$('#gAgain');if(a)a.onclick=()=>{G.ready();ready()};$('#gExit').onclick=exitPlay}
function exitPlay(){if(G)G.stop();G=null;run=false;clearInterval(timer);SND.back();$('#fade').classList.add('on');
  setTimeout(()=>{$('#play').hidden=true;$('#room').hidden=false;$('#title').textContent='FLIPERAMA';$('#backT').textContent='NAVE';roomOn=true;clock();fit();$('#fade').classList.remove('on')},220)}
function padLed(on){$('#padLed').classList.toggle('on',on)}
function input(d){if(!G)return;if(!run){if($('#gMsg').querySelector('#gAgain,#gExit'))return;begin()}if(run&&!paused)G.input(d)}
function pause(){if(!run||paused)return;paused=true;G.pause&&G.pause();msg('<h3>PAUSADO</h3><button class="gbtn" id="gRes">CONTINUAR</button><button class="gbtn alt" id="gExit">VOLTAR À SALA</button>');
  $('#gRes').onclick=()=>{paused=false;msg(null);G.resume&&G.resume()};$('#gExit').onclick=exitPlay}
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();held=null}});
document.querySelectorAll('#pad [data-d]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();input(b.dataset.d);b.classList.add('dn');setTimeout(()=>b.classList.remove('dn'),120)})});
(function(){let sx=0,sy=0,act=false;const el=$('#scr');
  el.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;act=true},{passive:true});
  el.addEventListener('touchmove',e=>{if(!act)return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;
    e.preventDefault();input(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));sx=t.clientX;sy=t.clientY},{passive:false});
  el.addEventListener('touchend',()=>{act=false},{passive:true});
  addEventListener('keydown',e=>{if($('#play').hidden)return;const d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(d){e.preventDefault();input(d)}})})();

/* ícones das setas e voltar */
const ARW=["...kk...","..kLLk..",".kLLLLk.","kLLLLLLk","kkkLLkkk","..kLLk..","..kLLk..","..kkkk.."];
const rotG=g=>g[0].split('').map((_,x)=>g.map(r=>r[x]).reverse().join(''));
['up','right','down','left'].forEach((d,n)=>{let g=ARW;for(let k=0;k<n;k++)g=rotG(g);const s=spriteRows(g,2,{L:'#e9e2ff'});
  document.querySelectorAll(`[data-d="${d}"]`).forEach(b=>b.innerHTML=s)});
$('#backIco').innerHTML=spriteRows(["...k","..kL",".kLL","kLLL",".kLL","..kL","...k"],2,{L:'#e9e2ff'});
$('#back').onclick=()=>{if(!$('#play').hidden){if(run){pause();return}exitPlay();return}talk('exit')};

/* carrega os jogos e abre a sala */
Promise.all(JOGOS.map(id=>new Promise(res=>{const s=document.createElement('script');s.src=`jogos/${id}.js?v=${APP_V}`;s.onload=s.onerror=res;document.head.append(s)}))).then(()=>{
  fit();clock();raf=requestAnimationFrame(loop);
  setTimeout(()=>{if(!unlocked())talk('locked');else if(left()<=0)talk('out');else if(A.intro!==dk()){A.intro=dk();saveA();talk('intro')}},350)});
addEventListener('resize',()=>{if(!$('#room').hidden)fit()});
</script>
</body>
