<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script>
/* recomeço do turno de 06/10/2026 (uma vez por aparelho): as missões feitas hoje voltam a ficar abertas, porque o
   turno sorteado começa hoje. A energia já ganha hoje fica (o registro guarda o maior valor do dia). */
(function(){const K='navemae-reset-2026-10-06',D='2026-10-06';
  try{if(localStorage.getItem(K))return;
    ['nostro9-stats-v1','numeris-stats-v1','mina-stats-v1','biblio-stats-v1','ivoti-stats-v1'].forEach(s=>{const o=JSON.parse(localStorage.getItem(s)||'null');if(!o)return;
      if(o.days)delete o.days[D];if(o.run)o.run={};if(o.prog)o.prog={};if(Array.isArray(o.lvDays))o.lvDays=o.lvDays.filter(x=>String(x).slice(0,10)!==D);
      localStorage.setItem(s,JSON.stringify(o))});
    localStorage.setItem(K,'1')}catch(e){}})();
</script>
<script>
/* iPhone (atalho da Tela de Início): ao voltar de outra página, o WebKit às vezes informa as margens seguras (Dynamic Island,
   barra de início) como 0 até a próxima rolagem — o topo sobe e as molduras ficam no tamanho errado. Guardamos as maiores
   margens já medidas neste modo (app ou navegador) e o CSS usa --sat/--sab, com env() só como reserva. */
/* o navegador não deve devolver a rolagem antiga ao voltar para a página: cada tela começa do topo */
try{if('scrollRestoration' in history)history.scrollRestoration='manual'}catch(e){}
(function(){const r=document.documentElement,M=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone?'app':'web',K='navemae-safe-'+M;
  r.classList.add(M); /* html.app = atalho da Tela de Início (tela cheia); html.web = navegador, que já tem a barra dele em cima */
  let s={};try{s=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
  const ap=()=>{if(s.t)r.style.setProperty('--sat',s.t+'px');if(s.b)r.style.setProperty('--sab',s.b+'px')};ap();
  function measure(){if(innerWidth>innerHeight)return; // só retrato
    const p=document.createElement('div');p.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';
    r.appendChild(p);const cs=getComputedStyle(p),t=parseFloat(cs.paddingTop)||0,b=parseFloat(cs.paddingBottom)||0;p.remove();
    let ch=false;if(t>(s.t||0)){s.t=t;ch=true}if(b>(s.b||0)){s.b=b;ch=true}
    if(ch){try{localStorage.setItem(K,JSON.stringify(s))}catch(e){}ap()}}
  measure();addEventListener('DOMContentLoaded',measure);addEventListener('load',measure);
  addEventListener('pageshow',()=>{measure();setTimeout(measure,300)});addEventListener('resize',()=>setTimeout(measure,200))})();
</script>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#100c0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Máquina do Tempo · Ivoti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* sem zoom de dois toques (cada área com rolagem precisa da regra) */
*{touch-action:manipulation}
:root{
  --bg:#100c0a;--panel:#1e1712;--panel2:#2a2019;--line:#4a3a2c;--line2:#86694e;--ink:#f5ecdc;--dim:#b8a68e;
  --st1:#1a120c;--st2:#4a3524;--st3:#7a5a3c;--st4:#c9a77a;--st5:#f0dcb8;
  --glow:#7fe3ff;--glow-d:#1d6f86;--amber:#ffb300;--amber-d:#b37a00;--red:#ff4a3d;--green:#5dff9a;--paper:#efe2c4;--paper-d:#c9b48a;
  --px:"Press Start 2P",monospace;--vt:"VT323",monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--vt);font-size:22px;line-height:1.15;min-height:100vh;min-height:100dvh;
  overflow-x:hidden;-webkit-text-size-adjust:100%;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  -webkit-font-smoothing:none;image-rendering:pixelated}
button,a{font:inherit;color:inherit;background:none;border:0;text-decoration:none;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
.spr{display:block;image-rendering:pixelated}
#bgc{position:fixed;inset:0;width:100%;height:100%;z-index:0;image-rendering:pixelated}
.crt{position:fixed;inset:0;pointer-events:none;z-index:80;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
#app{position:relative;z-index:1;max-width:440px;margin:0 auto;
  padding:calc(52px + var(--sat,env(safe-area-inset-top))) calc(16px + env(safe-area-inset-right)) calc(16px + var(--sab,env(safe-area-inset-bottom))) calc(16px + env(safe-area-inset-left))}

/* painéis com canto em degrau */
.px{background:var(--panel);position:relative;
  box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line);filter:drop-shadow(4px 4px 0 #000)}
.pbtn:active{transform:translate(4px,4px);filter:none}
.label{font-family:var(--px);font-size:9px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 18px}
.back{display:inline-flex;align-items:center;gap:8px;padding:11px 12px;font-family:var(--px);font-size:9px;color:var(--dim)}
.chip{padding:11px 12px;font-family:var(--px);font-size:9px;color:var(--glow)}
/* marca */
.brand{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.logo{flex:none;width:62px;height:62px;display:grid;place-items:center;position:relative;overflow:hidden;
  font-family:var(--px);font-size:15px;color:var(--glow);text-shadow:2px 2px 0 var(--glow-d);
  background:var(--st2);box-shadow:0 -4px 0 0 var(--st1),0 4px 0 0 var(--st1),-4px 0 0 0 var(--st1),4px 0 0 0 var(--st1),inset 0 -6px 0 0 var(--st1),inset 0 4px 0 0 var(--st3);
  filter:drop-shadow(4px 4px 0 #000);touch-action:none}
.brand .t{flex:1;min-width:0}
.brand .t p{font-family:var(--px);font-size:8px;color:var(--dim);letter-spacing:.1em}
.brand h1{font-family:var(--px);font-size:15px;line-height:1.45;margin-top:8px;color:var(--st5);text-shadow:2px 2px 0 var(--st1)}
.snd{flex:none;width:46px;height:46px;display:grid;place-items:center;font-family:var(--px);font-size:8px;color:var(--amber)}

/* terminal */
.term{padding:14px 16px;margin-bottom:24px;color:var(--glow);font-size:21px;background:#071318;
  box-shadow:0 -4px 0 0 #155446,0 4px 0 0 #155446,-4px 0 0 0 #155446,4px 0 0 0 #155446;filter:drop-shadow(4px 4px 0 #000)}
.cursor{display:inline-block;width:10px;height:18px;background:var(--glow);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* nível */
.nivel{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:24px}
.nivel .n{font-family:var(--px);font-size:22px;color:var(--glow);text-shadow:2px 2px 0 var(--glow-d);min-width:34px;text-align:center}
.nivel b{display:block;font-family:var(--px);font-size:10px;line-height:1.5;color:var(--st5)}
.nivel span{display:block;color:var(--dim);font-size:19px;margin-top:2px}
.pips{display:flex;gap:6px;margin-left:auto;flex:none}
.pips i{width:14px;height:14px;background:#0b0810;box-shadow:inset 0 0 0 3px var(--line)}
.pips i.on{background:var(--glow);box-shadow:inset 0 -4px 0 0 var(--glow-d)}

/* turno */
.turno{padding:14px 16px;margin-bottom:24px}
.turno-top{display:flex;justify-content:space-between;align-items:baseline}
.turno-n{font-family:var(--px);font-size:12px;color:var(--amber)}
.turno-n.all{color:var(--green)}
.week{display:flex;gap:6px;margin:12px 0 10px}
.day{flex:1;display:grid;justify-items:center;gap:5px;font-family:var(--px);font-size:8px;color:var(--dim)}
.day i{width:100%;height:14px;background:#0b0810;box-shadow:inset 0 0 0 2px var(--line2)}
.day.part i{background:var(--amber-d)}
.day.full i{background:var(--green)}
.day.today{color:var(--ink)}
.streak{color:var(--dim);font-size:20px}
.streak b{color:var(--amber);font-weight:normal}

/* missões */
.missions{display:grid;gap:18px;margin-bottom:24px}
.mission{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:14px;text-align:left;width:100%}
.mission .code{width:52px;height:52px;display:grid;place-items:center;font-family:var(--px);font-size:11px;color:var(--glow);
  background:var(--panel2);box-shadow:inset 0 0 0 3px var(--line)}
.mission b{display:block;font-family:var(--px);font-size:10px;line-height:1.5;color:var(--ink)}
.mission small{display:block;color:var(--dim);font-size:19px;margin-top:3px}
.mission .st{display:flex;align-items:center;gap:6px;margin-top:8px;font-family:var(--px);font-size:8px;color:var(--amber)}
.mission .st.ok{color:var(--green)}
.mission .st:not(.ok):not(.mid):not(.nx){color:var(--dim)}
.mission .st.mid{color:var(--glow)}
.mission.done{background:#10241a}
.mission.done .code{opacity:.55}
.mission.done b,.mission.done small{color:#7f9a88}
.mission.done b{text-decoration:line-through;text-decoration-thickness:2px}
.mission.next{background:var(--panel2);box-shadow:0 -4px 0 0 var(--amber),0 4px 0 0 var(--amber),-4px 0 0 0 var(--amber),4px 0 0 0 var(--amber)}
.mission .st.nx::after{content:"";width:0;height:0;border-left:7px solid var(--amber);border-top:6px solid transparent;border-bottom:6px solid transparent;animation:nudge .8s steps(2) infinite}
@keyframes nudge{50%{transform:translateX(4px)}}
.danger.done{filter:saturate(.35) brightness(.75) drop-shadow(4px 4px 0 #000)}

.danger{position:relative;display:block;width:100%;text-align:left;padding:16px;margin-bottom:22px;color:#fff;
  background:repeating-linear-gradient(135deg,rgba(0,0,0,.2) 0 12px,transparent 12px 24px),#8a3a12;
  box-shadow:0 -4px 0 0 var(--amber),0 4px 0 0 var(--amber),-4px 0 0 0 var(--amber),4px 0 0 0 var(--amber);filter:drop-shadow(4px 4px 0 #000);
  animation:rumble 2s steps(1) infinite}
@keyframes rumble{0%,90%{background-color:#8a3a12}92%{background-color:#a4461a}}
.danger .ey{font-family:var(--px);font-size:8px;letter-spacing:.12em;opacity:.85}
.danger .ti{font-family:var(--px);font-size:16px;margin:10px 0 8px;line-height:1.3}
.danger .su{font-size:19px;opacity:.9}
.danger .ok{position:absolute;top:14px;right:14px;font-family:var(--px);font-size:8px;color:var(--green)}
.danger.done{animation:none;background:repeating-linear-gradient(135deg,rgba(0,0,0,.2) 0 12px,transparent 12px 24px),#3f2a1c}
.tabua-btn{display:flex;width:100%;align-items:center;justify-content:center;gap:10px;padding:14px;font-family:var(--px);font-size:10px;color:var(--st5)}
/* jogar */
.play-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.play-head .label{color:var(--st4)}
.segs{display:flex;gap:4px;margin-bottom:16px}
.segs i{flex:1;height:10px;background:#0b0810;box-shadow:inset 0 0 0 2px var(--line2)}
.segs i.on{background:var(--green)}
.segs i.cur{background:var(--amber)}
.brief{color:var(--dim);font-size:20px;margin-bottom:16px}
.brief b{color:var(--st5);font-weight:normal}
.ask{font-family:var(--px);font-size:11px;line-height:1.6;text-align:center;color:var(--st5);margin:4px 0 14px}

/* ---- comemoração de missão concluída (mesmo código nos dois jogos) ---- */
.cel{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;width:100%}
.cel-hero{position:relative;width:100%;height:190px;display:grid;place-items:center}
.cel-rays{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;
  background:repeating-conic-gradient(var(--cel-ray) 0 12deg,transparent 12deg 24deg);
  -webkit-mask:radial-gradient(circle,#000 22%,transparent 68%);mask:radial-gradient(circle,#000 22%,transparent 68%);animation:celspin 9s steps(36) infinite}
@keyframes celspin{to{transform:rotate(360deg)}}
.cel-av{position:relative;animation:celjump .8s steps(2) infinite}
.cel-av .spr,.cel-av svg{display:block}
@keyframes celjump{50%{transform:translateY(-12px)}}
.cel.lose .cel-av{animation:celshake .3s steps(2) 4}
@keyframes celshake{50%{transform:translateX(-6px)}}
.cel-t{margin:0;font-family:var(--px);font-size:19px;line-height:1.4;color:var(--cel-acc);text-shadow:2px 2px 0 var(--cel-acc-d)}
.cel.lose .cel-t{color:var(--cel-bad);text-shadow:2px 2px 0 #000}
.cel-sub{margin:-4px 0 0;font-size:20px;line-height:1.15;color:var(--cel-dim)}
.cel-pop{animation:celpop .36s steps(3) both}
@keyframes celpop{0%{transform:scale(0)}65%{transform:scale(1.3)}100%{transform:scale(1)}}
.cel-stars{display:flex;gap:16px;align-items:flex-end;height:70px}
.cel-stars span:nth-child(2){margin-bottom:12px}
.cel-score{display:flex;align-items:baseline;gap:4px;font-family:var(--px);color:var(--cel-ink)}
.cel-score b{font-weight:400;font-size:28px;color:var(--cel-acc);text-shadow:2px 2px 0 var(--cel-acc-d);min-width:1.1em;text-align:right}
.cel-score span{font-size:16px}
.cel-score small{font-family:var(--vt);font-size:20px;color:var(--cel-dim);margin-left:10px}
.cel-en{display:flex;align-items:center;gap:8px;margin-top:-4px;font-family:var(--px);font-size:10px;color:#ffb300;text-shadow:2px 2px 0 #000;animation-delay:.3s}
.cel-turno{width:100%;padding:12px 14px;text-align:left}
.cel-tl{display:flex;justify-content:space-between;font-family:var(--px);font-size:8px;line-height:1;color:var(--cel-dim)}
.cel-tl b{font-weight:400;color:var(--cel-ink)}
.cel-segs{display:flex;gap:6px;margin-top:10px}
.cel-segs i{flex:1;height:12px;background:rgba(0,0,0,.4);box-shadow:inset 0 0 0 2px var(--cel-edge)}
.cel-segs i.on{background:var(--cel-ok);box-shadow:inset 0 -4px 0 0 rgba(0,0,0,.3)}
.cel-segs i.flash{animation:celflash .5s steps(2) 3}
@keyframes celflash{50%{background:#fff}}
.cel-banner{margin-top:12px;padding:10px 8px;font-family:var(--px);font-size:9px;line-height:1.5;text-align:center;color:#1a1200;background:var(--cel-acc2)}
.cel-btns{width:100%;display:flex;flex-direction:column;gap:12px;visibility:hidden}
.cel-btns.on{visibility:visible;animation:celup .3s steps(3)}
@keyframes celup{from{transform:translateY(16px);opacity:0}}
.cel-cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:45;image-rendering:pixelated}
@media (prefers-reduced-motion:reduce){.cel-rays,.cel-av{animation:none}}
.cel-btns>*{margin:0!important;width:100%}
#res{--cel-acc:var(--glow);--cel-acc-d:var(--glow-d);--cel-acc2:var(--amber);--cel-dim:var(--dim);--cel-ink:var(--ink);--cel-ok:var(--green);--cel-edge:var(--line2);--cel-bad:var(--red);--cel-ray:rgba(63,242,196,.22)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ghost{height:52px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--px);font-size:9px;color:var(--dim)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:14px;padding:17px 12px;font-family:var(--px);font-size:12px;
  background:var(--amber);color:#1a1200;
  box-shadow:0 -4px 0 0 var(--amber-d),0 4px 0 0 var(--amber-d),-4px 0 0 0 var(--amber-d),4px 0 0 0 var(--amber-d),inset 0 -5px 0 0 var(--amber-d);
  filter:drop-shadow(4px 4px 0 #000)}
.btn:active{transform:translate(4px,4px);filter:none}
.btn[disabled]{opacity:.45}

.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:50px;font-family:var(--px);font-size:18px;color:var(--ink)}
.key.ok{background:var(--amber);color:#1a1200;box-shadow:0 -4px 0 0 var(--amber-d),0 4px 0 0 var(--amber-d),-4px 0 0 0 var(--amber-d),4px 0 0 0 var(--amber-d),inset 0 -5px 0 0 var(--amber-d)}

.opts{display:grid;gap:14px}
.opt{padding:16px 12px;font-family:var(--px);font-size:18px;color:var(--glow);text-shadow:2px 2px 0 var(--glow-d);text-align:center}
.opt.n{color:var(--ink);text-shadow:none}
.opt.bad{opacity:.35;text-decoration:line-through}
.opt.good{background:#153a26}
.pair{display:flex;align-items:center;justify-content:center;gap:18px}
.pair .vs{font-family:var(--px);font-size:10px;color:var(--st1)}

.fb{min-height:0;margin-top:12px;padding:0 14px;font-size:21px;line-height:1.2}
.fb:not(:empty){padding:12px 14px}
.fb.ok{color:var(--green);background:#0e2016;box-shadow:inset 4px 0 0 0 var(--green)}
.fb.no{color:#ffb4aa;background:#2a1011;box-shadow:inset 4px 0 0 0 var(--red)}
.fb b{font-family:var(--px);font-size:10px;display:block;margin-bottom:6px}
.fb.ok b{color:var(--green)}.fb.no b{color:var(--red)}
.fb .eq{color:var(--ink)}
/* resultado */
.result{text-align:center;padding:26px 18px}
.result h2{font-family:var(--px);font-size:15px;line-height:1.5;color:var(--glow);margin:18px 0 10px}
.result .score{font-family:var(--px);font-size:28px;color:var(--st5);margin:14px 0 6px}
.result p{color:var(--dim)}
.gate{display:grid;place-items:center}

/* sobreposições */
.overlay{position:fixed;inset:0;z-index:60;display:flex;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:calc(52px + var(--sat,env(safe-area-inset-top))) 16px calc(16px + var(--sab,env(safe-area-inset-bottom)));background:rgba(8,6,12,.93)}
.modal{width:100%;max-width:400px;padding:22px 18px;margin:auto}
.modal h2{font-family:var(--px);font-size:12px;color:var(--amber);line-height:1.5;margin-bottom:14px;text-align:center}
.modal p{color:var(--dim);margin-top:10px}
.modal ul{list-style:none;display:grid;gap:10px;margin-top:14px}
.modal li{color:var(--ink);font-size:20px}
.modal li b{font-family:var(--px);font-size:12px;color:var(--glow);font-weight:normal;margin-right:6px}
.tsyms{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tsyms .s{height:70px;display:grid;place-items:center;align-content:center;gap:6px;background:var(--st2);box-shadow:inset 0 -5px 0 0 var(--st1),inset 0 4px 0 0 var(--st3)}
.tsyms .s b{font-family:var(--px);font-size:18px;color:var(--glow);text-shadow:2px 2px 0 var(--glow-d)}
.tsyms .s i{font-style:normal;font-size:20px;color:var(--st5)}
.tsyms .s.lock{background:var(--panel2);box-shadow:inset 0 0 0 3px var(--line)}
.tsyms .s.lock b,.tsyms .s.lock i{color:#9a8aa0;text-shadow:none}
.levelup{text-align:center}
.levelup .big{font-family:var(--px);font-size:48px;color:var(--glow);text-shadow:4px 4px 0 var(--glow-d);margin:18px 0 6px}
.stat{margin-top:14px}
.stat .top{display:flex;justify-content:space-between;font-size:20px}
.stat .top .v{color:var(--dim)}
.meter{height:10px;background:#0b0810;box-shadow:inset 0 0 0 2px var(--line);margin-top:6px}
.meter i{display:block;height:100%;background:var(--glow)}
.errs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.errs span{background:var(--panel2);padding:4px 8px;font-size:19px}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.lv button{padding:12px 0;font-family:var(--px);font-size:10px;color:var(--dim)}
.lv button.on{color:var(--glow);box-shadow:0 -4px 0 0 var(--glow),0 4px 0 0 var(--glow),-4px 0 0 0 var(--glow),4px 0 0 0 var(--glow)}
.sep{height:3px;margin:18px 0 4px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px)}
.shake{animation:shake .3s steps(4)}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
/* no navegador (fora do atalho) não há Dynamic Island nem desfoque no topo: menos folga em cima */
html.web #app{padding-top:calc(20px + var(--sat,env(safe-area-inset-top)))}
html.web .overlay{padding-top:calc(24px + var(--sat,env(safe-area-inset-top)))}

/* ---------- Máquina do Tempo: menu ---------- */
.logo{background:#2a2019}
.mission .st.xt{color:var(--glow)}
.viagem{padding:14px 16px;margin-bottom:24px}
.viagem .turno-top{margin-bottom:12px}
.caps{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 8px;margin:0 -4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.caps::-webkit-scrollbar{display:none}
.cap{flex:none;width:62px;display:grid;justify-items:center;gap:6px;padding:8px 2px 7px;background:#140f0b;box-shadow:inset 0 0 0 2px var(--line)}
.cap i{height:34px;display:grid;place-items:center;font-style:normal}
.cap span{font-family:var(--px);font-size:6px;line-height:1.3;color:var(--dim);text-align:center}
.cap.ok{background:#20301e;box-shadow:inset 0 0 0 2px #3f7a35}
.cap.ok span{color:var(--green)}
.cap.now{background:var(--panel2);box-shadow:inset 0 0 0 2px var(--amber)}
.cap.now span{color:var(--amber)}
.cap.lock i{font-family:var(--px);font-size:14px;color:#5a4a3a}
.pass{padding:14px 16px;margin-bottom:22px}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stamp{display:grid;justify-items:center;gap:8px;padding:12px 4px 10px;background:#140f0b;box-shadow:inset 0 0 0 2px var(--line)}
.stamp .ring{width:54px;height:54px;display:grid;place-items:center;
  background:repeating-linear-gradient(90deg,transparent 0 4px,#140f0b 4px 6px) 0 0/100% 3px no-repeat,repeating-linear-gradient(90deg,transparent 0 4px,#140f0b 4px 6px) 0 100%/100% 3px no-repeat;
  box-shadow:inset 0 0 0 3px #4a3a2c}
.stamp .ring .spr{opacity:.25;filter:grayscale(1)}
.stamp span{font-family:var(--px);font-size:6px;line-height:1.4;color:var(--dim);text-align:center}
.stamp.got{background:#2a1a14}
.stamp.got .ring{box-shadow:inset 0 0 0 3px #e03a26;transform:rotate(-6deg)}
.stamp.got .ring .spr{opacity:1;filter:none}
.stamp.got span{color:#ffb4a8}
.danger{background:repeating-linear-gradient(135deg,rgba(0,0,0,.22) 0 12px,transparent 12px 24px),#6b4528;animation:none}
.danger.done{background:repeating-linear-gradient(135deg,rgba(0,0,0,.2) 0 12px,transparent 12px 24px),#3a2a1c}
.danger .dico{position:absolute;right:14px;bottom:12px}
.danger .ok{color:var(--green)}

/* ---------- telas de jogo ---------- */
.screen.game:not([hidden]){display:flex;flex-direction:column;min-height:calc(100vh - 68px - var(--sat,env(safe-area-inset-top)) - var(--sab,env(safe-area-inset-bottom)));
  min-height:calc(100dvh - 68px - var(--sat,env(safe-area-inset-top)) - var(--sab,env(safe-area-inset-bottom)))}
html.web .screen.game:not([hidden]){min-height:calc(100dvh - 36px - var(--sat,env(safe-area-inset-top)) - var(--sab,env(safe-area-inset-bottom)))}
.ctitle{font-family:var(--px);font-size:13px;line-height:1.5;color:var(--st5);margin:-4px 0 12px;text-shadow:2px 2px 0 #000}
/* cena */
.scn{position:relative;align-self:center;margin-bottom:14px;box-shadow:0 -4px 0 0 var(--st2),0 4px 0 0 var(--st2),-4px 0 0 0 var(--st2),4px 0 0 0 var(--st2);filter:drop-shadow(4px 4px 0 #000);background:#000}
.scn canvas{display:block;image-rendering:pixelated}
.scn .lbl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-family:var(--px);font-size:8px;line-height:1;pointer-events:none}
.scn .sg{padding:5px 6px 4px;color:#f5ecdc;background:#6b4528;box-shadow:0 -2px 0 0 #3b2416,0 2px 0 0 #3b2416,-2px 0 0 0 #3b2416,2px 0 0 0 #3b2416}
.scn .cap{display:block;width:auto;padding:0;background:none;box-shadow:none;color:#3b2416}
.scn .bub{padding:6px 7px 5px;color:#140c08;background:#fff;box-shadow:0 -2px 0 0 #140c08,0 2px 0 0 #140c08,-2px 0 0 0 #140c08,2px 0 0 0 #140c08}
/* texto do diário: papel antigo */
.page{position:relative;padding:14px 16px 16px;margin-bottom:14px;color:#2a1a10;background:var(--paper);font-size:22px;line-height:1.12;
  box-shadow:0 -4px 0 0 var(--paper-d),0 4px 0 0 var(--paper-d),-4px 0 0 0 var(--paper-d),4px 0 0 0 var(--paper-d),inset 0 -5px 0 0 #e0cfa6;filter:drop-shadow(4px 4px 0 #000)}
.word{margin-top:12px;padding:10px 12px;background:#2a2019;color:var(--ink);font-size:20px;box-shadow:inset 4px 0 0 0 var(--amber)}
.word b{display:block;font-family:var(--px);font-size:8px;font-weight:normal;color:var(--amber);margin-bottom:6px;letter-spacing:.06em}
.word b em{font-style:normal;color:#fff}
.dots{display:flex;justify-content:center;align-items:center;gap:6px}
.dots i{width:10px;height:10px;background:#140f0b;box-shadow:inset 0 0 0 2px var(--line2)}
.dots i.on{background:var(--amber);box-shadow:none}
.nav3{display:grid;grid-template-columns:62px 1fr 62px;gap:10px;margin-top:auto}
.nav3 .key{height:56px}
.key[disabled]{opacity:.35;filter:none}
.nxt{height:56px;margin:0}
/* perguntas */
.qbox{padding:14px 16px;margin-bottom:14px}
.qtag{font-family:var(--px);font-size:7px;color:var(--dim);margin-bottom:10px;letter-spacing:.06em}
.qtxt{font-size:24px;line-height:1.12;color:var(--ink)}
.opts{display:grid;gap:12px;margin-bottom:12px}
.opt{text-shadow:none;padding:15px 12px;font-family:var(--vt);font-size:23px;line-height:1.05;color:var(--ink);text-align:left}
.opt.good{background:#153a26;box-shadow:0 -4px 0 0 var(--green),0 4px 0 0 var(--green),-4px 0 0 0 var(--green),4px 0 0 0 var(--green)}
.opt.bad{opacity:.4;text-decoration:line-through}
.opt.show{background:#153a26}
.qfoot{display:grid;grid-template-columns:1fr;gap:10px;margin-top:auto}
.qfoot.two{grid-template-columns:1fr 1fr}
/* linha do tempo */
.ins{color:var(--dim);font-size:21px;margin-bottom:12px}
.ins b{color:var(--amber);font-weight:normal}
.tl{position:relative;display:grid;gap:8px;padding-left:26px;margin-bottom:14px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:4px;background:var(--line2)}
.slot{position:relative;min-height:46px;display:flex;align-items:center;gap:10px;padding:6px 10px;background:#140f0b;box-shadow:inset 0 0 0 2px var(--line);color:var(--dim);font-size:20px}
.slot::before{content:"";position:absolute;left:-22px;top:50%;width:12px;height:12px;margin-top:-6px;background:var(--line2)}
.slot.f{background:var(--paper);color:#2a1a10;box-shadow:none}
.slot.f::before{background:var(--amber)}
.slot .yr{flex:none;min-width:58px;font-family:var(--px);font-size:8px;line-height:1.3;color:#7a3a10}
.slot.new{animation:pop .3s steps(3)}
@keyframes pop{from{transform:scale(.6)}}
.bank{display:grid;grid-template-columns:1fr;gap:10px;margin-top:auto}
.evc{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;min-height:52px;padding:8px 12px;text-align:left;font-size:21px;line-height:1.02;color:var(--ink)}
.evc .ic{display:grid;place-items:center}
.evc.bad{background:#3a1410}
.fb{min-height:0;margin:0 0 12px;padding:0 14px;font-size:21px;line-height:1.15}
.fb:not(:empty){padding:12px 14px}
/* arquivo */
.drawers{display:flex;gap:6px;margin-bottom:14px}
.drawers i{flex:1;display:grid;justify-items:center;gap:4px;padding:6px 0 5px;font-style:normal;font-family:var(--px);font-size:7px;color:var(--dim);background:#140f0b;box-shadow:inset 0 0 0 2px var(--line)}
.drawers i b{font-weight:normal;font-size:10px;color:var(--ink)}
.drawers i.hot{box-shadow:inset 0 0 0 2px var(--amber)}
.drawers i.up{animation:pop .4s steps(3)}
/* casa enxaimel */
.hs{position:absolute;padding:0;background:rgba(127,227,255,.14);box-shadow:inset 0 0 0 2px rgba(127,227,255,.75);animation:hsb 1s steps(2) infinite}
@keyframes hsb{50%{background:rgba(127,227,255,.32)}}
.mats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.mats button{display:flex;align-items:center;justify-content:center;gap:10px;height:52px;font-family:var(--px);font-size:9px;color:var(--dim)}
.mats button i{width:18px;height:14px}
.mats button.on{color:var(--ink);box-shadow:0 -4px 0 0 var(--amber),0 4px 0 0 var(--amber),-4px 0 0 0 var(--amber),4px 0 0 0 var(--amber)}
.guide{padding:12px 14px;margin-bottom:12px}
.guide .label{color:var(--amber);margin-bottom:8px}
.guide p{font-size:21px;line-height:1.12;color:var(--ink)}
.guide p.fact{margin-top:6px;color:var(--glow);font-size:20px}
.steps{display:flex;gap:4px;margin-bottom:12px}
.steps i{flex:1;height:10px;background:#140f0b;box-shadow:inset 0 0 0 2px var(--line2)}
.steps i.on{background:var(--green);box-shadow:none}
.steps i.cur{background:var(--amber);box-shadow:none}
/* viagem no tempo */
#warp{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:#05040f}
#warp canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#warp .yr{position:relative;font-family:var(--px);font-size:34px;color:var(--amber);text-shadow:4px 4px 0 #000;text-align:center;line-height:1.3}
#warp .yr small{display:block;font-size:10px;color:var(--glow);margin-bottom:14px;letter-spacing:.1em}
/* carimbo novo */
.stampbig{display:grid;place-items:center;margin:10px auto 6px;width:120px;height:120px;transform:rotate(-8deg);box-shadow:inset 0 0 0 6px #e03a26;animation:stamp .5s steps(4) both}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.2);opacity:0}}
.words li{display:block}
.words li b{display:block;font-size:9px!important;margin-bottom:4px}
@media (max-height:700px){.page{font-size:21px;padding:12px 14px}.ctitle{margin-bottom:8px}.nav3 .key,.nav3 .btn,.nxt{height:50px}.opt{padding:12px}}
/* depois de responder, as alternativas que não importam mais somem (a certa e a escolhida ficam) */
.opts.answered .opt:not(.good):not(.bad):not(.show){display:none}
/* telas baixas (iPhone 8, Android pequeno) */
@media (max-height:680px){.bar{margin-bottom:10px}.play-head{margin-bottom:6px}.segs{margin-bottom:8px}.qbox{padding:10px 12px;margin-bottom:10px}.qtxt{font-size:22px}
  .opts{gap:10px}.opt{padding:10px 12px;font-size:21px}.fb:not(:empty){padding:8px 12px}.fb{font-size:19px}.page{font-size:20px;padding:10px 12px}
  .tl{gap:6px;margin-bottom:10px}.slot{min-height:40px;font-size:18px;padding:4px 10px}.bank{gap:8px}.evc{min-height:44px;font-size:19px;padding:6px 10px}}

/* terminal + turno do dia numa tela só (menos blocos no topo) */
.term{padding:14px 16px 12px}
.term .tmsg{min-height:48px}
.term{box-shadow:0 -4px 0 0 #1d5a6b,0 4px 0 0 #1d5a6b,-4px 0 0 0 #1d5a6b,4px 0 0 0 #1d5a6b}
.tdiv{height:2px;margin:12px 0 10px;background:repeating-linear-gradient(90deg,var(--glow) 0 6px,transparent 6px 11px);opacity:.45}
.trow{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--px);font-size:8px;letter-spacing:.08em;color:var(--glow)}
.trow>span{opacity:.7}
.trow .turno-n{font-size:12px;color:var(--glow);text-shadow:none}
.trow .turno-n.all{color:var(--green)}
.term .week{display:flex;gap:6px;margin:10px 0 8px}
.term .day{flex:1;display:grid;justify-items:center;gap:5px;font-family:var(--px);font-size:8px;color:var(--glow);opacity:.6}
.term .day i{width:100%;height:12px;background:transparent;box-shadow:inset 0 0 0 2px var(--glow)}
.term .day.part i{background:repeating-linear-gradient(90deg,var(--glow) 0 2px,transparent 2px 4px)}
.term .day.full i{background:var(--glow)}
.term .day.today{opacity:1}
.term .streak{margin:0;font-size:20px;line-height:1.1;color:var(--glow);opacity:.85}
.term .streak b{color:var(--glow);font-weight:normal;opacity:1;text-shadow:0 0 6px var(--glow)}

/* ---------- cards das missões e do desafio: mesmo padrão nos 4 jogos ----------
   ícone 56 px à esquerda · título (Press Start 10) · subtítulo (VT 20) · status (Press Start 8) embaixo.
   Estados: FEITO (verde, riscado), PRÓXIMA (moldura âmbar), CONTINUAR (em andamento), TREINO EXTRA, A FAZER. */
.missions{display:grid;gap:16px;margin-bottom:22px}
.missions .mission{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;min-height:88px;width:100%;padding:14px;text-align:left}
.missions .mission .code{width:56px;height:56px;display:grid;place-items:center;background:var(--M-tile);box-shadow:inset 0 0 0 3px var(--M-line);font-size:0}
.missions .mission .mt{display:block;min-width:0}
.missions .mission b{display:block;font-family:var(--px);font-size:10px;line-height:1.5;font-weight:400;color:var(--M-ink);text-decoration:none}
.missions .mission small{display:block;margin-top:4px;font-family:var(--vt);font-size:20px;line-height:1;color:var(--M-dim)}
.missions .mission .st{display:flex;align-items:center;gap:6px;min-height:12px;margin-top:8px;font-family:var(--px);font-size:8px;line-height:1;color:var(--M-dim);text-transform:uppercase;white-space:nowrap;animation:none;text-shadow:none}
.missions .mission .st.ok{color:var(--M-ok)}
.missions .mission .st.nx{color:var(--M-next)}
.missions .mission .st.mid,.missions .mission .st.go{color:var(--M-mid)}
.missions .mission .st.xt{color:var(--M-xt)}
.missions .mission .st.nx::after{content:"";width:0;height:0;border-left:7px solid var(--M-next);border-top:6px solid transparent;border-bottom:6px solid transparent;animation:nudge .8s steps(2) infinite}
.missions .mission.done .code{opacity:.55}
.missions .mission.done b,.missions .mission.done small{color:var(--M-donetxt)}
.missions .mission.done b{text-decoration:line-through;text-decoration-thickness:2px}
@keyframes nudge{50%{transform:translateX(4px)}}
button.dcard{display:block;width:100%;min-height:0;margin:0 0 22px;padding:14px 16px 16px;text-align:left;animation:none}
button.dcard .ey{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--px);font-size:8px;line-height:1;letter-spacing:.1em;opacity:1}
button.dcard .ey>span:first-child{opacity:.85}
button.dcard .dg{display:grid;grid-template-columns:1fr 56px;gap:14px;align-items:center;margin-top:12px}
button.dcard .ti{display:block;margin:0;text-transform:uppercase;font-family:var(--px);font-size:15px;line-height:1.3}
button.dcard .su{display:block;margin-top:8px;font-family:var(--vt);font-size:20px;line-height:1.05;opacity:.92}
button.dcard .dico{position:static;width:56px;height:56px;display:grid;place-items:center;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 3px rgba(0,0,0,.35)}
button.dcard .ok,button.dcard .st{position:static;display:flex;align-items:center;gap:6px;margin:0;font-family:var(--px);font-size:8px;color:var(--M-ok);text-shadow:2px 2px 0 #000;letter-spacing:0}
:root{--M-tile:var(--panel2);--M-line:var(--line);--M-ink:var(--ink);--M-dim:var(--dim);--M-ok:var(--green);--M-next:var(--amber);--M-mid:var(--glow);--M-xt:var(--glow);--M-donetxt:#8a9a80}

/* logo igual ao card do jogo na Nave-Mãe: quadro de 72 px com o ícone a 4 px por pixel */
.brand .logo{width:72px;height:72px;padding:0;background:var(--panel2);font-size:0;text-shadow:none;box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line);filter:drop-shadow(4px 4px 0 #000)}
.brand .logo .spr{display:block}
/* tela de missão cumprida em telas baixas (iPhone 8, Android): herói, estrelas e botões menores, sem rolar */
@media (max-height:700px){.cel{gap:8px}.cel-hero{height:132px}.cel-hero>*{transform:scale(.72)}.cel-t{font-size:16px}.cel-sub{font-size:18px}
  .cel-stars{height:54px;transform:scale(.8);margin:-4px 0}.cel-turno{padding:8px 12px}.cel-segs{margin-top:6px}.cel-btns{gap:8px}.cel-btns .btn,.cel-btns .ghost{min-height:46px;height:46px}}
@media (max-height:600px){.cel-hero{height:104px}.cel-hero>*{transform:scale(.58)}.cel-stars{height:46px;transform:scale(.7);margin:-8px 0}.cel-score b{font-size:22px}}
</style>
<script>
/* sem zoom: bloqueia pinça e dois toques no app inteiro */
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
</script>
</head>
<body>
<canvas id="bgc"></canvas>

<main id="app">
<!-- MENU -->
<section class="screen" id="menu">
  <div class="bar"><button class="back px pbtn" data-home>&lt; Nave-Mãe</button></div>
  <header class="brand">
    <div class="logo" id="logo" aria-label="Máquina do Tempo"></div>
    <div class="t"><p>PLANETA HISTÓRIA · TERRA</p><h1>Máquina do Tempo</h1></div>
  </header>
  <div class="term"><div class="tmsg"><span id="term"></span><span class="cursor"></span></div>
    <div class="tdiv"></div>
    <div class="trow"><span>TURNO DE HOJE</span><span class="turno-n" id="turnoN">0 / 3</span></div>
    <div class="week" id="week"></div>
    <p class="streak" id="streak"></p>
  </div>

  <div class="viagem px">
    <div class="turno-top"><span class="label">Viagem por Ivoti</span><span class="turno-n" id="capN">0 / 12</span></div>
    <div class="caps" id="caps"></div>
  </div>

  <nav class="missions">
    <button class="mission px pbtn" data-go="diario"><span class="code" data-ico="scroll"></span><span class="mt"><b>Diário da viagem</b><small id="diaSub">Capítulo do dia</small><span class="st" data-st="diario"></span></span></button>
    <button class="mission px pbtn" data-go="linha"><span class="code" data-ico="hourglass"></span><span class="mt"><b>Linha do tempo</b><small>O que veio antes?</small><span class="st" data-st="linha"></span></span></button>
    <button class="mission px pbtn" data-go="arquivo"><span class="code" data-ico="stampMuseum"></span><span class="mt"><b>Arquivo da memória</b><small>Lembre o que já viu</small><span class="st" data-st="arquivo"></span></span></button>
  </nav>

  <button class="danger dcard" id="goCasa"><span class="ey"><span>DESAFIO OPCIONAL</span><span class="ok" id="casaOk" hidden>FEITO ✓</span></span><span class="dg"><span><span class="ti">MONTE A CASA ENXAIMEL</span><span class="su">Madeira, pregos de pau, barro e tijolo.</span></span><span class="dico" id="casaIco"></span></span></button>

  <div class="pass px">
    <div class="turno-top"><span class="label">Passaporte de Ivoti</span><span class="turno-n" id="passN">0 / 6</span></div>
    <div class="stamps" id="stamps"></div>
  </div>

  <button class="tabua-btn px pbtn" id="openWords"><span id="wordIco"></span>CADERNO DE PALAVRAS</button>
</section>

<!-- DIÁRIO -->
<section class="screen game" id="dia" hidden>
  <div class="bar"><button class="back px pbtn" data-back>&lt; Máquina</button><button class="chip px pbtn" data-words>PALAVRAS</button></div>
  <div class="play-head"><span class="label" id="dHead"></span><span class="label" id="dPg"></span></div>
  <h2 class="ctitle" id="dTitle"></h2>
  <div id="dBody" style="display:flex;flex-direction:column;flex:1"></div>
</section>

<!-- LINHA DO TEMPO -->
<section class="screen game" id="lin" hidden>
  <div class="bar"><button class="back px pbtn" data-back>&lt; Máquina</button></div>
  <div class="play-head"><span class="label">LINHA DO TEMPO</span><span class="label" id="lN"></span></div>
  <div class="segs" id="lSegs"></div>
  <p class="ins">Toque no acontecimento <b>mais antigo</b> que ainda falta.</p>
  <div class="tl" id="tl"></div>
  <div class="fb" id="lfb"></div>
  <div class="bank" id="bank"></div>
</section>

<!-- ARQUIVO -->
<section class="screen game" id="arq" hidden>
  <div class="bar"><button class="back px pbtn" data-back>&lt; Máquina</button><button class="chip px pbtn" data-words>PALAVRAS</button></div>
  <div class="play-head"><span class="label">ARQUIVO DA MEMÓRIA</span><span class="label" id="aN"></span></div>
  <div class="segs" id="aSegs"></div>
  <div class="drawers" id="drawers"></div>
  <div id="aBody" style="display:flex;flex-direction:column;flex:1"></div>
</section>

<!-- CASA ENXAIMEL -->
<section class="screen game" id="casa" hidden>
  <div class="bar"><button class="back px pbtn" data-back>&lt; Máquina</button></div>
  <div class="play-head"><span class="label">MONTE A CASA ENXAIMEL</span><span class="label" id="cN"></span></div>
  <div class="steps" id="cSteps"></div>
  <div id="cBody" style="display:flex;flex-direction:column;flex:1"></div>
</section>

<!-- RESULTADO -->
<section class="screen" id="res" hidden></section>
</main>

<div id="warp" hidden><canvas id="warpc"></canvas><div class="yr" id="warpY"></div></div>

<!-- CADERNO DE PALAVRAS -->

<script>
/* atualização automática: compara com version.json e recarrega com ?v=<versão> no endereço (o iPhone não reaproveita a
   página guardada). Se mesmo com ?v=<versão> a página veio velha, não insiste (evita recarregar sem parar). */
const APP_V='20261010114737';
(function(){const H0=location.hash,base=location.pathname.replace(/[^/]*$/,''),root=base.replace(/(nostro-9|numeris|mina|ivoti)\/$/,'');
  async function check(){try{const r=await fetch(root+'version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const {v}=await r.json();
    const q=new URLSearchParams(location.search).get('v');
    if(v&&v!==APP_V&&q!==v)location.replace(location.pathname+'?v='+v+H0)}catch(e){}}
  check();document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});addEventListener('pageshow',e=>{if(e.persisted)check()});
})();
</script>
<script>
/* som no iPhone (opção "Tocar no silencioso" das configurações da Nave-Mãe):
   desligada = modo "ambiente": mistura com a música do celular, e a chave de silencioso cala o app;
   ligada = modo "reprodução": toca mesmo no silencioso, mas o iOS pausa as outras mídias.
   O iOS não oferece a sites um modo que faça as duas coisas. */
function navAudioMode(){let on=false;try{on=!!(JSON.parse(localStorage.getItem('navemae-v1'))||{}).silentPlay}catch(e){}
  try{if(navigator.audioSession)navigator.audioSession.type=on?'playback':'ambient'}catch(e){}}
navAudioMode();addEventListener('pageshow',navAudioMode);
/* todo contexto de áudio nasce depois de reafirmar o modo (no iOS, o modo vale para o contexto criado em seguida) */
function newAC(){navAudioMode();return new (window.AudioContext||window.webkitAudioContext)()}
/* vibração leve a cada toque.
   iPhone: o Safari não tem API de vibração; o único jeito é o toque do próprio dedo cair num interruptor nativo
   (<input type=checkbox switch>, iOS 18+). Por isso cada botão recebe por dentro um <label> invisível que cobre
   o botão inteiro e aciona um interruptor escondido; o clique continua chegando ao botão normalmente.
   Android: navigator.vibrate. */
(function(){
  const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const SEL='button,a[href],[role=button]';
  if(!IOS){document.addEventListener('click',e=>{if(navigator.vibrate&&e.target.closest(SEL))try{navigator.vibrate(8)}catch(_){}} ,true);return}
  function arm(el){if(el.disabled||el.querySelector(':scope>label[data-hap]'))return;
    const l=document.createElement('label');l.setAttribute('data-hap','');l.setAttribute('aria-hidden','true');
    const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');i.tabIndex=-1;
    i.addEventListener('click',e=>e.stopPropagation());l.append(i);
    // o label "rouba" a ação nativa do elemento: refaz a navegação do link e o envio do formulário
    l.addEventListener('click',e=>{if(e.target!==l)return;setTimeout(()=>{if(e.defaultPrevented)return;
      if(el.tagName==='A'&&el.href)location.href=el.href;else if(el.type==='submit'&&el.form)el.form.requestSubmit(el)},0)});
    if(getComputedStyle(el).position==='static')el.style.position='relative';
    el.append(l)}
  function scan(root){if(root.nodeType!==1)return;if(root.matches(SEL))arm(root);root.querySelectorAll(SEL).forEach(arm)}
  const st=document.createElement('style');
  st.textContent='label[data-hap]{position:absolute;inset:0;z-index:5;display:block;margin:0;padding:0;background:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}'+
    'label[data-hap]>input{position:absolute;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}'+
    ':disabled>label[data-hap]{pointer-events:none}';
  document.head.append(st);
  function start(){scan(document.body);new MutationObserver(ms=>{for(const m of ms){m.addedNodes.forEach(scan);
    if(m.type==='childList'&&m.target.closest){const t=m.target.closest(SEL);if(t)arm(t)} // texto do botão trocado: arma de novo
    if(m.type==='attributes'&&m.target.matches&&m.target.matches(SEL))arm(m.target)}}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled']})}
  if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
})();
</script>

function warp(label,then){const w=$('#warp'),c=$('#warpc'),x=c.getContext('2d'),W=c.width=Math.ceil(innerWidth/3),H=c.height=Math.ceil(innerHeight/3);w.hidden=false;SND.warp();
  const pts=Array.from({length:110},()=>({a:Math.random()*6.283,r:Math.random()*6+1,v:Math.random()*.6+.3,c:['#ffb300','#7fe3ff','#f5ecdc'][Math.random()*3|0]}));
  const t0=performance.now(),D=1500,Y=$('#warpY');
  (function f(t){const k=Math.min(1,(t-t0)/D);x.fillStyle='rgba(5,4,15,.3)';x.fillRect(0,0,W,H);
    pts.forEach(p=>{const r0=p.r,r1=p.r+=p.v*(1+k*10);x.strokeStyle=p.c;x.beginPath();x.moveTo(W/2+Math.cos(p.a)*r0|0,H/2+Math.sin(p.a)*r0|0);x.lineTo(W/2+Math.cos(p.a)*r1|0,H/2+Math.sin(p.a)*r1|0);x.stroke();if(p.r>W)p.r=2});
    Y.innerHTML=`<small>VIAJANDO PARA</small>${k<.8?String(1000+Math.floor(Math.random()*1026)):label}`;
    if(k<1)requestAnimationFrame(f);else setTimeout(()=>{w.hidden=true;then()},380)})(t0)}

let DG=null;

/* pergunta de múltipla escolha (Diário e Arquivo): a primeira alternativa é a certa */

/* revisão espaçada: caixa 0..5; acertou sobe de caixa e volta daqui a 1, 1, 3, 7, 14 ou 30 dias; errou volta para a caixa 0 */

function cardAfter(id,ok){const t=dkey(),c=S.cards[id];
  if(!c){S.cards[id]={b:ok?1:0,due:addDays(t,1)};save();return} // primeira vez (no Diário): volta amanhã
  c.b=ok?Math.min(5,c.b+1):0;c.due=addDays(t,INT[c.b]);save()}

/* ---------- LINHA DO TEMPO ---------- */
let LN=null;const LROUNDS=3;
function poolEvents(){return [...new Set(readCaps().flatMap(c=>c.ev))].map(id=>Object.assign({id},EVENTS[id]))}
function genRounds(){const evs=poolEvents();if(evs.length<3)return null;const newest=readCaps().slice(-1)[0].ev,R=[];
  for(let r=0;r<LROUNDS;r++){const n=evs.length>=10?5:evs.length>=5?4:r<2?3:evs.length,pickd=[],ys=new Set();
    const add=e=>{if(e&&!ys.has(e.y)&&!pickd.includes(e)){pickd.push(e);ys.add(e.y)}};
    if(r<2)add(evs.find(e=>e.id===pick(newest)));shuffle(evs.slice()).forEach(e=>{if(pickd.length<n)add(e)});R.push(pickd.map(e=>e.id))}
  return R}
function startLinha(){mode='linha';const rs=genRounds();show('lin');
  if(!rs){$('#tl').innerHTML='';$('#lSegs').innerHTML='';$('#lN').textContent='';needDiary($('#bank'));return}
  LN={rs,r:0,firsts:0,miss:false,placed:[]};renderLinha()}
function renderLinha(){const ids=LN.rs[LN.r],evs=ids.map(id=>Object.assign({id},EVENTS[id])),sorted=[...evs].sort((a,b)=>a.y-b.y);
  $('#lN').textContent=`RODADA ${LN.r+1}/${LROUNDS}`;$('#lSegs').innerHTML=Array.from({length:LROUNDS},(_,i)=>`<i class="${i<LN.r?'on':i===LN.r?'cur':''}"></i>`).join('');
  $('#tl').innerHTML=sorted.map((e,i)=>{const f=i<LN.placed.length;return `<div class="slot${f?' f':''}${f&&i===LN.placed.length-1&&LN.justPlaced?' new':''}">${f?`<span class="yr">${e.lb}</span>${esc(e.t)}`:i===0?'Mais antigo':i===sorted.length-1?'Mais novo':''}</div>`}).join('');
  if(!LN.order)LN.order=shuffle(ids.slice());
  $('#bank').innerHTML=LN.order.filter(id=>!LN.placed.includes(id)).map(id=>{const e=EVENTS[id];return `<button class="evc px pbtn" data-ev="${id}"><span class="ic">${sprite(e.ic,e.ic==='ship'?1:2)}</span><span>${esc(e.t)}</span></button>`}).join('');
  $('#bank').querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>tapEvent(b.dataset.ev,b));LN.justPlaced=false}
function tapEvent(id,b){const ids=LN.rs[LN.r],rest=ids.filter(x=>!LN.placed.includes(x)),oldest=rest.reduce((a,x)=>EVENTS[x].y<EVENTS[a].y?x:a,rest[0]);
  if(id===oldest){SND.place();LN.placed.push(id);LN.justPlaced=true;$('#lfb').className='fb';$('#lfb').innerHTML='';
    if(LN.placed.length===ids.length){renderLinha();if(!LN.miss)LN.firsts++;record('linha',!LN.miss);sfx.ok();
      $('#lfb').className='fb ok';$('#lfb').innerHTML='<b>LINHA CERTA!</b>Do mais antigo para o mais novo.';
      $('#bank').innerHTML=`<button class="btn" id="lGo" style="grid-column:1/-1;margin:0">${LN.r+1>=LROUNDS?'CONCLUIR':'PRÓXIMA RODADA'}</button>`;
      $('#lGo').onclick=()=>{sfx.tap();LN.r++;LN.placed=[];LN.order=null;LN.miss=false;$('#lfb').innerHTML='';$('#lfb').className='fb';if(LN.r>=LROUNDS)finishLinha();else renderLinha()};return}
    renderLinha();return}
  sfx.no();b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake','bad');setTimeout(()=>b.classList.remove('bad'),700);
  if(!LN.miss){LN.miss=true;record('linha',false,'Ordem: '+EVENTS[id].t)}else errAdd('linha','Ordem: '+EVENTS[id].t);
  $('#lfb').className='fb no';$('#lfb').innerHTML=`<b>AINDA NÃO</b>“${esc(EVENTS[id].t)}” aconteceu depois. Procure algo mais antigo.`}
function finishLinha(){const fresh=!doneToday().includes('linha');if(fresh)markDone('linha');sfx.win();
  celebrate({title:'LINHA DO TEMPO PRONTA!',sub:'Você colocou a história em ordem.',stars:LN.firsts===LROUNDS?3:LN.firsts>=2?2:1,score:[LN.firsts,LROUNDS],scoreLabel:'rodadas de primeira',
    energy:fresh?en(LN.firsts,'linha'):0,turno:turnoInfo(fresh&&REQ().includes('linha')),buttons:endButtons(()=>startLinha())})}

/* ---------- ARQUIVO DA MEMÓRIA ---------- */
let AQ=null;
function arqPick(){const t=dkey(),pool=readCaps().flatMap(c=>c.q.map((q,i)=>({c,q,id:c.id+':'+i})));if(pool.length<3)return null;
  const st=x=>S.cards[x.id]||{b:0,due:t},due=pool.filter(x=>st(x).due<=t).sort((a,b)=>st(a).due.localeCompare(st(b).due)||st(a).b-st(b).b);
  const rest=shuffle(pool.filter(x=>!due.includes(x))).sort((a,b)=>st(a).b-st(b).b);
  return shuffle([...due,...rest].slice(0,Math.min(6,pool.length)))}
function startArq(){mode='arquivo';const cs=arqPick();show('arq');
  if(!cs){$('#aSegs').innerHTML='';$('#drawers').innerHTML='';$('#aN').textContent='';needDiary($('#aBody'));return}

  return ['NOVA','1','2','3','4','5'].map((l,i)=>`<i class="${i===hot?'hot':''}${i===up?' up':''}">GAV. ${l}<b>${cnt[i]}</b></i>`).join('')}
function renderArq(){const it=AQ.cs[AQ.i],cur=(S.cards[it.id]||{b:0}).b;$('#aN').textContent=`FICHA ${AQ.i+1}/${AQ.cs.length}`;
  $('#aSegs').innerHTML=AQ.cs.map((_,i)=>`<i class="${i<AQ.i?'on':i===AQ.i?'cur':''}"></i>`).join('');$('#drawers').innerHTML=drawersHTML(cur);
  quiz($('#aBody'),it.q,`CAP. ${CAPS.indexOf(it.c)+1} · ${it.c.t.toUpperCase()}`,ok=>{cardAfter(it.id,ok);if(ok)AQ.firsts++;record('arquivo',ok,ok?null:it.q.k);
    SND.drawer();$('#drawers').innerHTML=drawersHTML(-1,S.cards[it.id].b)},()=>{AQ.i++;if(AQ.i>=AQ.cs.length)finishArq();else renderArq()})}
function finishArq(){const fresh=!doneToday().includes('arquivo');if(fresh)markDone('arquivo');sfx.win();const n=AQ.cs.length,f=AQ.firsts;
  celebrate({title:'ARQUIVO EM DIA!',sub:'As fichas voltam quando for hora de lembrar.',stars:f===n?3:f/n>=.6?2:1,score:[f,n],energy:fresh?en(f,'arquivo'):0,turno:turnoInfo(fresh&&REQ().includes('arquivo')),buttons:endButtons(()=>startArq())})}

/* ---------- DESAFIO: MONTE A CASA ENXAIMEL ---------- */
const CSTEPS=[
  {k:'stones',n:4,t:'ALICERCE',h:'Comece pela base: toque nos 4 lugares das pedras.',snd:'wood'},
  {k:'posts',n:5,t:'MADEIRAS EM PÉ',h:'Coloque as 5 madeiras em pé.',f:'Na casa enxaimel, a estrutura de madeira fica aparente.',snd:'wood'},
  {k:'beams',n:3,t:'VIGAS DEITADAS',h:'Agora as 3 vigas deitadas.',snd:'wood'},
  {k:'diag',n:2,t:'DIAGONAIS',h:'Coloque as peças na diagonal, nos cantos de baixo. Elas deixam a parede firme.',snd:'wood'},
  {k:'pegs',n:15,t:'PREGOS DE PAU',h:'Prenda cada cruzamento com um prego de pau.',f:'As peças são presas com encaixes e pregos de pau.',snd:'peg'},
  {k:'fill',n:5,t:'PREENCHER',h:'Escolha BARRO ou TIJOLO e toque nos espaços da parede.',f:'Os espaços são preenchidos com barro ou com tijolos.',snd:'mud'},
  {k:'roof',n:3,t:'TELHADO',h:'Por fim, o telhado: toque para colocar as telhas.',snd:'wood'},
];
let CA=null;
function startCasa(){mode='desafio';CA={s:0,stones:[],posts:[],beams:[],diag:[],pegs:[],fill:{},roof:0,mat:'b',q:shuffle(CASA_Q.slice()),qi:-1,firsts:0};show('casa');renderCasa()}
function casaState(){const st=CA.s+1;return{st,stones:CA.stones,posts:CA.posts,beams:CA.beams,diag:CA.diag,pegs:CA.pegs,fill:CA.fill,roof:CA.roof}}
function renderCasa(){const b=$('#cBody');$('#cSteps').innerHTML=CSTEPS.map((_,i)=>`<i class="${i<CA.s?'on':i===CA.s?'cur':''}"></i>`).join('');
  if(CA.qi>=0){$('#cN').textContent=`PERGUNTA ${CA.qi+1}/${CA.q.length}`;const q=CA.q[CA.qi];
    quiz(b,q,'PERGUNTA DO MESTRE CARPINTEIRO',ok=>{if(ok)CA.firsts++;record('desafio',ok,ok?null:q.k)},()=>{CA.qi++;if(CA.qi>=CA.q.length)finishCasa();else renderCasa()});return}
  const sp=CSTEPS[CA.s];$('#cN').textContent=`PASSO ${CA.s+1}/${CSTEPS.length}`;
  b.innerHTML=`<div class="scn" id="scn"><canvas id="scv"></canvas></div>
    ${sp.k==='fill'?`<div class="mats"><button class="px pbtn${CA.mat==='b'?' on':''}" data-mat="b"><i style="background:#d9c49a"></i>BARRO</button><button class="px pbtn${CA.mat==='t'?' on':''}" data-mat="t"><i style="background:repeating-linear-gradient(0deg,#b84a2e 0 4px,#7d2a18 4px 5px)"></i>TIJOLO</button></div>`:''}
    <div class="guide px"><div class="label">${sp.t} · ${countOf(sp)}/${sp.n}</div><p>${sp.h}</p>${sp.f?`<p class="fact">${sp.f}</p>`:''}</div>`;
  const box=$('#scn'),cv=$('#scv'),cw=Math.min(b.clientWidth||360,440);cv.width=Math.floor(cw/2);cv.height=SC_H+10;cv.style.width=cv.width*2+'px';cv.style.height=(SC_H+10)*2+'px';
  const ov=drawScene(cv,'casa',casaState()),g=ov.geo;
  hotspots(g,sp).forEach(h=>{const e=document.createElement('button');e.className='hs';e.setAttribute('aria-label',sp.t);
    e.style.cssText=`left:${h.x*2}px;top:${h.y*2}px;width:${h.w*2}px;height:${h.h*2}px`;e.onclick=()=>place(sp,h.i);box.appendChild(e)});
  b.querySelectorAll('[data-mat]').forEach(x=>x.onclick=()=>{sfx.tap();CA.mat=x.dataset.mat;renderCasa()})}
const countOf=sp=>sp.k==='fill'?Object.keys(CA.fill).length:sp.k==='roof'?CA.roof:CA[sp.k].length;
function hotspots(g,sp){const{x0,top,cw,rh,cols,rows,bw,w,wall,base,by,hw}=g,out=[];
  if(sp.k==='stones'){const sw=(w+4)/4;for(let i=0;i<4;i++)if(!CA.stones.includes(i))out.push({i,x:x0-2+i*sw,y:by-base-3,w:sw-1,h:base+6})}
  if(sp.k==='posts')for(let c=0;c<=cols;c++)if(!CA.posts.includes(c))out.push({i:c,x:x0+c*cw-3,y:top,w:bw+6,h:wall})
  if(sp.k==='beams')for(let r=rows;r>=0;r--)if(!CA.beams.includes(r))out.push({i:r,x:x0,y:top+r*rh-3,w:w,h:bw+6})
  if(sp.k==='diag')[[0,0],[1,3]].forEach(([i,c])=>{if(!CA.diag.includes(i))out.push({i,x:x0+bw+c*cw,y:top+bw+rh,w:cw-bw,h:rh-bw})});
  if(sp.k==='pegs')for(let r=0;r<=rows;r++)for(let c=0;c<=cols;c++){const i=r*(cols+1)+c;if(!CA.pegs.includes(i))out.push({i,x:x0+c*cw-6,y:top+r*rh-6,w:14,h:14})}
  if(sp.k==='fill')for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const k=r*cols+c;if((r===0&&(c===1||c===2))||(r===1&&c===2)||CA.fill[k])continue;out.push({i:k,x:x0+bw+c*cw,y:top+bw+r*rh,w:cw-bw,h:rh-bw})}
  if(sp.k==='roof'&&CA.roof<3)out.push({i:CA.roof,x:x0-4,y:Math.max(0,top-hw-2),w:w+8,h:hw+2-Math.max(0,hw+2-top)});
  return out}
function place(sp,i){SND[sp.snd]();if(sp.k==='fill')CA.fill[i]=CA.mat;else if(sp.k==='roof')CA.roof++;else CA[sp.k].push(i);
  if(countOf(sp)>=sp.n){CA.s++;sfx.ok();if(CA.s>=CSTEPS.length){CA.qi=0;CA.s=CSTEPS.length;showHouse();return}}renderCasa()}
/* casa pronta: mostra inteira antes das perguntas */
function showHouse(){const b=$('#cBody');$('#cSteps').innerHTML=CSTEPS.map(()=>'<i class="on"></i>').join('');$('#cN').textContent='CASA PRONTA!';
  b.innerHTML=`<div class="scn" id="scn"><canvas id="scv"></canvas></div><div class="guide px"><div class="label">CASA PRONTA!</div><p>Casas assim foram construídas em Ivoti entre 1826 e 1950. Muitas estão de pé até hoje no Núcleo de Casas Enxaimel.</p></div>
    <div class="qfoot"><button class="btn" id="cQ">PERGUNTAS DO CARPINTEIRO</button></div>`;
  const cv=$('#scv'),cw=Math.min(b.clientWidth||360,440);cv.width=Math.floor(cw/2);cv.height=SC_H+10;cv.style.width=cv.width*2+'px';cv.style.height=(SC_H+10)*2+'px';
  drawScene(cv,'casa',{st:8,fill:CA.fill,roof:3});sfx.win();$('#cQ').onclick=()=>{sfx.tap();renderCasa()}}
function finishCasa(){const fresh=!doneToday().includes('desafio');markDone('desafio');S.escapes=(S.escapes||0)+1;save();sfx.win();const n=CA.q.length;
  celebrate({title:'CASA ENXAIMEL PRONTA!',sub:'Um carpinteiro de verdade!',stars:CA.firsts===n?3:CA.firsts>=2?2:1,score:[CA.firsts,n],energy:fresh?8:0,turno:turnoInfo(false),buttons:endButtons(()=>startCasa())})}

/* ---------- fim de missão ---------- */
const en=(f,m)=>!REQ().includes(m)?5:10+Math.min(10,f)+(planDay(dkey()).full?10:0); // energia (mesma regra da Nave-Mãe): fora do turno, treino extra +5
function celebrate(o){show('res');CEL.play(Object.assign({host:$('#res'),avatar:(!o.lose&&navAvatar('cheer',2))||navAvatar('pilot',2)||sprite('hourglass',6)},o))}
const turnoInfo=fresh=>{const p=planDay(dkey());return{n:p.done,total:p.total,streak:planStreak(),fresh}};
function endButtons(again){const nx=REQ().find(m=>!doneToday().includes(m)),back=()=>{sfx.tap();if(DL){backHome();return}show('menu')},rep=()=>{sfx.tap();again()};
  const T={diario:'DIÁRIO',linha:'LINHA DO TEMPO',arquivo:'ARQUIVO'};
  return nx?[{label:`PRÓXIMA: ${T[nx]}`,cls:'btn',fn:()=>{sfx.tap();startMission(nx)}},{label:'DE NOVO',cls:'ghost px pbtn',fn:rep},{label:'VOLTAR À MÁQUINA',cls:'ghost px pbtn',fn:back}]
    :[{label:'VOLTAR À MÁQUINA',cls:'btn',fn:back},{label:'DE NOVO',cls:'ghost px pbtn',fn:rep}]}

/* =================== fundo (céu da Terra à noite) =================== */
(function(){const c=$('#bgc'),x=c.getContext('2d');let P=[];
  function size(){c.width=Math.ceil(innerWidth/3);c.height=Math.ceil(innerHeight/3);
    P=Array.from({length:Math.round(c.width*c.height/300)},()=>({x:Math.random()*c.width|0,y:Math.random()*c.height|0,p:Math.random()*6.28,v:Math.random()*.02+.005}))}
  size();addEventListener('resize',size);
  (function f(){x.fillStyle='#100c0a';x.fillRect(0,0,c.width,c.height);
    for(let y=0;y<c.height;y+=12)for(let i=((y/12)%2)*9;i<c.width;i+=18){x.fillStyle='#140f0c';x.fillRect(i|0,y,17,11)}
    P.forEach(p=>{p.p+=p.v;const a=(Math.sin(p.p)+1)/2;x.fillStyle=a>.9?'#ffb300':a>.6?'#4a3a2c':'#1e1712';x.fillRect(p.x,p.y,1,1)});
    requestAnimationFrame(f)})();
})();

/* =================== início =================== */
$('#wordIco').innerHTML=sprite('scroll',2);$('#casaIco').innerHTML=sprite('stampHouse',fitS('stampHouse'));$('#casaOk').innerHTML=sprite('check',2)+'FEITO';
document.querySelectorAll('[data-ico]').forEach(el=>el.innerHTML=sprite(el.dataset.ico,fitS(el.dataset.ico)));
addEventListener('pageshow',()=>{if(current==='menu')renderMenu()});
show('menu');
const RETK='ret:'+location.pathname,RP=(location.hash.match(/r=([\w.]+)/)||[])[1];
if(RP)try{sessionStorage.setItem(RETK,RP)}catch(e){}
const RETV=RP||(()=>{try{return sessionStorage.getItem(RETK)}catch(e){return null}})()||'';
const RET='../?v='+APP_V+(RETV.startsWith('p.')?'#p='+RETV.slice(2):'#v=tasks'); // padrão: aba Missões; ?v= evita voltar para uma Nave-Mãe guardada (velha)
var DL=false;
function backHome(){location.href=RET}
document.querySelectorAll('[data-home]').forEach(b=>b.addEventListener('click',()=>backHome()));
function deepLink(){const m=(location.hash.match(/m=(\w+)/)||[])[1];if(!m)return;history.replaceState(null,'',location.pathname);
  DL=RETV==='tasks';document.querySelectorAll('[data-back]').forEach(b=>b.textContent=DL?'< Missões':'< Máquina');
  if(m==='desafio')startCasa();else if(MODES.includes(m))startMission(m)}
deepLink();addEventListener('hashchange',deepLink);
</script>
<script>
/* pet do piloto (escolhido no Hangar da Nave-Mãe, lido de navemae-avatar.pet): passeia em cima do terminal e,
   tocado, pula, faz o som dele e fala. Na tela de missão cumprida ele comemora ao lado do piloto. Mesmo código em todos os jogos. */
(function(){let p=null;try{p=(JSON.parse(localStorage.getItem('navemae-avatar'))||{}).pet}catch(e){}
  if(!p||!p.f0||typeof spriteRows!=='function')return;
  const svg=rows=>spriteRows(rows.map(r=>[...r].reverse().join('')),2,p.pal); // virado para a esquerda
  const nome=p.name.charAt(0)+p.name.slice(1).toLowerCase();
  const st=document.createElement('style');st.textContent=`
.npet{position:absolute;z-index:2;display:block;cursor:pointer;-webkit-user-select:none;user-select:none}
.npet i{display:block;font-style:normal}.npet svg{display:block}.npet .pf1{position:absolute;left:0;top:0;opacity:0;animation:npwag 1.6s steps(1) infinite}
@keyframes npwag{0%{opacity:0}70%{opacity:1}80%{opacity:0}88%{opacity:1}96%{opacity:0}}
.npet-h,.npet-b{display:block;position:relative}
.npet.on-term{right:18px;bottom:calc(100% + 4px);animation:nptrol 16s steps(48) infinite}
.npet.on-term .npet-b{animation:npface 16s steps(1) infinite}
@keyframes nptrol{0%,40%{transform:translateX(0)}52%,86%{transform:translateX(-96px)}98%,100%{transform:translateX(0)}}
@keyframes npface{0%{transform:none}86%{transform:scaleX(-1)}98%{transform:none}}
.npet.on-term.walk .pf1{animation-duration:.3s}
.npet-h.hop{animation:nphop .5s steps(5)}
@keyframes nphop{0%{transform:translateY(0)}20%{transform:translateY(-10px)}40%{transform:translateY(-14px)}60%{transform:translateY(-10px)}80%{transform:translateY(-2px)}100%{transform:translateY(0)}}
.npet.on-cel{right:-44px;bottom:0}
.npet.on-cel .npet-h{animation:nphop .6s steps(6) infinite}
.cel-av{position:relative}
.npet-say{position:absolute;bottom:100%;right:-4px;margin-bottom:6px;padding:4px 5px 3px;font-family:"Press Start 2P",monospace;font-size:7px;font-weight:400;line-height:1;color:#ffd23f;background:rgba(7,6,15,.85);white-space:nowrap;opacity:0;transition:opacity .15s steps(2);pointer-events:none}
.npet-say.on{opacity:1}`;document.head.append(st);
  function snd(){try{if(typeof SY==='undefined')return;(p.sfx||[]).forEach(s=>s[0]==='noise'?SY.noise(s[1],s[2],s[3]):SY.note(s[1],s[2],s[3],s[4]))}catch(e){}}
  let n=0;
  function make(cls){const el=document.createElement('span');el.className='npet '+cls;el.setAttribute('aria-label',nome);
    el.innerHTML=`<b class="npet-say"></b><span class="npet-h"><span class="npet-b"><i class="pf0">${svg(p.f0)}</i><i class="pf1">${svg(p.f1)}</i></span></span>`;
    el.addEventListener('click',e=>{e.stopPropagation();const h=el.querySelector('.npet-h'),s=el.querySelector('.npet-say');
      h.classList.remove('hop');void h.offsetWidth;h.classList.add('hop');snd();n++;
      s.textContent=[p.say,`${nome} torce por você!`,'♥',`${nome} ${p.trick}!`][n%4];s.classList.add('on');clearTimeout(s._t);s._t=setTimeout(()=>s.classList.remove('on'),1500)});
    return el}
  function put(){const t=document.querySelector('.term,.terminal');if(t&&!t.querySelector('.npet')){if(getComputedStyle(t).position==='static')t.style.position='relative';t.append(make('on-term'))}
    document.querySelectorAll('.cel-av').forEach(av=>{if(av.innerHTML&&!av.querySelector('.npet'))av.append(make('on-cel'))})}
  put();new MutationObserver(put).observe(document.body,{childList:true,subtree:true});
})();
</script>
